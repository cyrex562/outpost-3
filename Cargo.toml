[package]
name = "outpost3"
version = "0.1.0"
edition = "2021"
authors = ["Outpost 3 Team"]
description = "A colony management and wormhole trade simulation game"
license = "MIT"

[dependencies]
# Web framework
actix-web = "4"
actix-rt = "2"
actix-files = "0.6"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Templating
tera = "1"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Random number generation
rand = "0.8"

# Configuration
config = "0.14"

[dev-dependencies]
actix-web-test = "0.1"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
