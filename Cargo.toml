[workspace]
members = ["crates/outpost-core", "crates/outpost-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Outpost 3 Team"]
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Random number generation
rand = "0.8"

# Async runtime (for server only)
tokio = { version = "1", features = ["full"] }

# Web framework (for server only)
actix-web = "4"
actix-rt = "2"
actix-files = "0.6"

# Templating (for server only)
tera = "1"

# Database (for server only)
rusqlite = { version = "0.31", features = ["bundled", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Configuration (for server only)
config = "0.14"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
