[package]
name = "outpost3"
version = "0.1.0"
edition = "2021"
authors = ["Outpost 3 Team"]
description = "A colony management and wormhole trade simulation game"
license = "MIT"

[lib]




# Legacy actix web server (optional, built with --features server)
[[bin]]
name = "outpost3-server"
path = "src/main.rs"


[features]
default = ["server"]
# Enable the legacy actix web server
server = ["actix-web", "actix-rt", "actix-files", "tera"]

[dependencies]
# Web framework (optional, only when "server" feature enabled)
actix-web = { version = "4", optional = true }
actix-rt = { version = "2", optional = true }
actix-files = { version = "0.6", optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Templating (optional, only when "server" feature enabled)
tera = { version = "1", optional = true }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Random number generation
rand = "0.8"

# Configuration
config = "0.14"

[dev-dependencies]
proptest = "1"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
