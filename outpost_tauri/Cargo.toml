[package]
name = "outpost_tauri"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "outpost_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "outpost_tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
outpost_core = { path = "../outpost_core" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
include_dir = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace]
