[package]
name = "outpost_tauri"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "outpost_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# The actual executable filename (outpost3.exe on Windows) — kept distinct
# from the crate/package name above, which stays `outpost_tauri` to avoid
# rippling a rename through docs/scripts that reference the crate. Per
# tauri-utils' own guidance, renaming the bin target directly (rather than
# tauri.conf.json's `mainBinaryName` override) is the preferred way to name
# the shipped binary.
name = "outpost3"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
#
# Tauri v2 decides dev-vs-production at compile time via this feature on the
# `tauri` crate (see `tauri-macros::context::ContextData { dev: cfg!(not(feature
# = "custom-protocol")), .. }`) — NOT `debug_assertions` and NOT an env var.
# Without it, even a `--release` build embeds a dev-mode `Context` that tries
# to load `build.devUrl` (http://localhost:5173) instead of the bundled
# frontend, and fails at startup with a "can't connect to localhost" error
# since no dev server is running. `cargo tauri build`/`cargo tauri dev` pass
# this automatically by convention; any direct `cargo build`/`cargo xwin
# build` invocation (e.g. `cargo xtask build-windows-portable`) must pass
# `--features custom-protocol` explicitly.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
outpost_core = { path = "../outpost_core" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
include_dir = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace]
