name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, Test, Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # This is the gate CLAUDE.md documents, and it passes clean.
      #
      # Deliberately without `--tests`: library code is warning-free, but test
      # code still carries a large backlog of pedantic lints (cast precision,
      # excessive bools in fixtures, long test fns). Adding `--tests` here
      # would fail immediately, which is why an earlier revision of this file
      # dropped `-D warnings` altogether rather than narrowing the scope — and
      # that left the real gate unenforced. Narrow the scope, keep the teeth.
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --check --all

      - name: Harness check
        run: cargo run --bin harness -- check content/checks/bootstrap

  # `outpost_tauri` is excluded from the workspace (see the root Cargo.toml),
  # so every `--workspace` step above skips it entirely. That blind spot let a
  # clippy failure sit on `main` unnoticed (issue #446); this job closes it.
  #
  # Split out rather than folded above because it needs WebKit2GTK system
  # libraries the workspace jobs have no use for, and installing them for
  # every run would slow the common path down for nothing.
  tauri:
    name: Tauri shell (Build, Test, Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Tauri v2's documented Linux prerequisites. Package names verified
      # against a machine that builds this crate rather than taken from
      # memory: `libwebkit2gtk-4.1-dev` provides `webkit2gtk-4.1.pc`, which is
      # what `pkg-config` fails to find when this crate cannot compile.
      - name: Install WebKit2GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: outpost_tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Format needs no compilation, so it is the one check that would have
      # worked for this crate all along.
      - name: Format check
        run: cargo fmt --check --all --manifest-path outpost_tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path outpost_tauri/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test --manifest-path outpost_tauri/Cargo.toml
