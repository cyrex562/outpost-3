name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', 'release-*', '*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test (Desktop targets)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Linux dependencies for Bevy (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxi-dev libgl1-mesa-dev

      - name: Verify workspace compiles
        run: cargo check --workspace

      - name: Test outpost-core
        run: cargo test -p outpost-core --all-features --no-fail-fast

      - name: Build outpost-client (release)
        run: cargo build -p outpost-client --release

      - name: QA Smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          OUTPOST_SMOKE_SECONDS=2 xvfb-run -a target/release/outpost-client || true

      - name: QA Smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OUTPOST_SMOKE_SECONDS = "2"
          target/release/outpost-client.exe

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: outpost-client-linux
          path: target/release/outpost-client
          if-no-files-found: warn

      - name: Upload to GitHub Release (Linux, on tag)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/outpost-client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: outpost-client-windows
          path: target/release/outpost-client.exe
          if-no-files-found: warn

      - name: Upload to GitHub Release (Windows, on tag)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/outpost-client.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wasm:
    name: Build WASM bundle (Trunk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build WASM with Trunk (release)
        working-directory: crates/outpost-client
        run: trunk build --release

      - name: WASM QA Smoke (dist check)
        run: node bin/wasm_smoke.mjs

      - name: Upload WASM bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: outpost-client-wasm-dist
          path: crates/outpost-client/dist
          if-no-files-found: warn

      - name: Zip WASM bundle (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd crates/outpost-client
          zip -r ../outpost-client-wasm-dist.zip dist

      - name: Upload WASM bundle to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crates/outpost-client/../outpost-client-wasm-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
