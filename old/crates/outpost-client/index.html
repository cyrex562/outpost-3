<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outpost 3 (WASM)</title>
    <!-- Trunk will inject the compiled wasm/js -->
    <link data-trunk rel="rust" data-bin="outpost-client" />
    <style>
      html, body { height: 100%; margin: 0; background: #0d0d14; }
      #root { position: fixed; inset: 0; display: grid; }
      #outpost-canvas { width: 100%; height: 100%; outline: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="outpost-canvas"></canvas>
    </div>
  </body>
  </html>
