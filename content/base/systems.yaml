# Authored star-system scenarios.
#
# Each entry defines a star system that can be selected at bootstrap and
# seeds `SystemState.node_map`. Body records mirror `outpost_core::system::Body`
# 1:1 (name / kind / role / distance_au / attributes). `role` is optional; the
# parser falls back to `unassigned`.
#
# Environmental attributes (atmosphere, temperature, gravity_g, radiation) are
# used by `outpost_core::system::Body::habitability()` to derive a 0–100 rating
# and a productivity modifier applied to colony output. See issue #163.
# Enums use snake_case tags:
#   atmosphere:  none | thin | breathable | dense | toxic
#   temperature: frozen | cold | temperate | hot | extreme
#   radiation:   low | moderate | high
#
# `subtype` (issue #196) is content-authoring guidance layered on top of the
# above — it never changes habitability() itself, but it does bias which
# commodities spawn as hex-map deposits (see PlanetMap::generate_for_body_and_subtype
# in outpost_core::map) and should be chosen consistent with the authored
# attributes above it (e.g. `molten` pairs with hot/toxic/dense/high-radiation).
# Valid subtype tags, and which `kind` each is valid on:
#   rocky_barren_hot | rocky_barren_cold | molten | earth_like | ocean  → inner_planet only
#   rocky | icy                                                        → inner_planet, moon, asteroid_belt
#   gas_giant | ice_giant                                              → gas_giant only
#   unclassified (default)                                             → any kind
#
# `tidally_locked` / `axial_tilt_deg` / `rotation_period_hours` / `moon_count`
# / `parent_body` (issue #196) are flavor-only for now — no mechanical effect.
# `parent_body` names another body's `name` in the same system (a `moon` of a
# `moon`, not just of a planet/giant, is representable this way).
#
# Bootstrap picks the first authored system when no explicit id is passed —
# selection UI can be layered on later without changing the schema.

- id: kepler-186
  name: Kepler-186
  description: >
    A well-charted G-type system with three inner rocky worlds, a modest
    asteroid belt, a ringed gas giant, and a lonely outer world.
  bodies:
    - name: Kepler-A
      kind: inner_planet
      role: raw_extraction
      distance_au: 0.4
      atmosphere: thin
      temperature: hot
      gravity_g: 0.62
      radiation: high
      subtype: rocky_barren_hot
    - name: Kepler-B
      kind: inner_planet
      role: population_hub
      distance_au: 0.7
      atmosphere: breathable
      temperature: temperate
      gravity_g: 0.98
      radiation: low
      subtype: earth_like
    - name: Kepler-C
      kind: inner_planet
      role: science
      distance_au: 1.1
      atmosphere: thin
      temperature: cold
      gravity_g: 0.85
      radiation: moderate
      subtype: rocky_barren_cold
      axial_tilt_deg: 41.0
    - name: Ceres Belt
      kind: asteroid_belt
      role: raw_extraction
      distance_au: 2.4
      atmosphere: none
      temperature: frozen
      gravity_g: 0.05
      radiation: moderate
      subtype: icy
    - name: Aurelian
      kind: gas_giant
      role: fuel_production
      distance_au: 4.2
      atmosphere: dense
      temperature: cold
      gravity_g: 2.4
      radiation: high
      subtype: ice_giant
      moon_count: 1
    - name: Aurelian-Moon
      kind: moon
      role: industry
      distance_au: 4.35
      atmosphere: none
      temperature: cold
      gravity_g: 0.18
      radiation: high
      subtype: icy
      parent_body: Aurelian
      tidally_locked: true
    - name: Selkin
      kind: inner_planet
      distance_au: 6.8
      atmosphere: toxic
      temperature: frozen
      gravity_g: 1.3
      radiation: moderate
      subtype: icy
      rotation_period_hours: 960.0

- id: trappist-1
  name: Trappist-1
  description: >
    A crowded ultra-cool dwarf system with seven tightly-packed inner worlds
    and a wide, resource-rich asteroid ring. Short travel times, thin margins.
  bodies:
    - name: T-1a
      kind: inner_planet
      role: raw_extraction
      distance_au: 0.11
      atmosphere: thin
      temperature: hot
      gravity_g: 0.55
      radiation: high
      subtype: rocky_barren_hot
      tidally_locked: true
    - name: T-1b
      kind: inner_planet
      role: population_hub
      distance_au: 0.15
      atmosphere: breathable
      temperature: temperate
      gravity_g: 0.95
      radiation: moderate
      subtype: earth_like
      tidally_locked: true
    - name: T-1c
      kind: inner_planet
      role: science
      distance_au: 0.21
      atmosphere: thin
      temperature: temperate
      gravity_g: 0.9
      radiation: moderate
      # Judgment call: thin (not breathable) atmosphere disqualifies this
      # from earth_like despite the temperate band — see issue #196.
      subtype: rocky_barren_cold
      tidally_locked: true
    - name: T-1d
      kind: inner_planet
      role: industry
      distance_au: 0.28
      atmosphere: dense
      temperature: cold
      gravity_g: 1.15
      radiation: moderate
      subtype: rocky_barren_cold
      tidally_locked: true
    - name: T-1e
      kind: inner_planet
      distance_au: 0.38
      atmosphere: none
      temperature: cold
      gravity_g: 0.72
      radiation: high
      subtype: rocky
      tidally_locked: true
    - name: T-1f
      kind: inner_planet
      distance_au: 0.52
      atmosphere: toxic
      temperature: frozen
      gravity_g: 0.88
      radiation: high
      subtype: icy
      tidally_locked: true
    - name: T-1g
      kind: inner_planet
      distance_au: 0.71
      atmosphere: none
      temperature: frozen
      gravity_g: 0.6
      radiation: high
      subtype: icy
      tidally_locked: true
    - name: Outer Ring
      kind: asteroid_belt
      role: raw_extraction
      distance_au: 1.9
      atmosphere: none
      temperature: frozen
      gravity_g: 0.04
      radiation: moderate
      subtype: icy
