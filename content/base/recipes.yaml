# Production recipe definitions for the base-colony pack (issue #166).
#
# Passive/infrastructure buildings (warehouse, trade_depot, sensor_array) are
# intentionally absent — see their descriptions in buildings.yaml for why.

# ── Starter set ──────────────────────────────────────────────────────────────

- id: pump_water
  name: Pump Water
  building: water_well
  cycle_sols: 1
  inputs: []
  outputs:
    - id: water
      quantity: 24.0

- id: bottle_water
  name: Bottle Water
  description: >
    Crates banked water into shippable `water_container` cargo (issue
    #348/#380's crating route). Switchable against `unbottle_water` — a
    water_bottling_plant runs one or the other, not both.
  building: water_bottling_plant
  cycle_sols: 1
  inputs:
    - id: water
      quantity: 20.0
  outputs:
    - id: water_container
      quantity: 20.0
  power_draw: 3.0

- id: unbottle_water
  name: Unbottle Water
  description: >
    Unpacks `water_container` cargo back into usable, banked water — the
    receiving side of #348/#380's crating route.
  building: water_bottling_plant
  cycle_sols: 1
  inputs:
    - id: water_container
      quantity: 20.0
  outputs:
    - id: water
      quantity: 20.0
  power_draw: 3.0

- id: crate_waste
  name: Crate Waste
  description: >
    Crates banked waste into shippable `waste_container` cargo (issue
    #348/#389's crating route). Switchable against `uncrate_waste` — a
    waste_compactor runs one or the other, not both.
  building: waste_compactor
  cycle_sols: 1
  inputs:
    - id: waste
      quantity: 20.0
  outputs:
    - id: waste_container
      quantity: 20.0
  power_draw: 3.0

- id: uncrate_waste
  name: Uncrate Waste
  description: >
    Unpacks `waste_container` cargo back into usable, bunker-storable waste
    — the receiving side of #348/#389's crating route, letting a colony with
    spare `waste_processing` capacity genuinely absorb another colony's
    surplus.
  building: waste_compactor
  cycle_sols: 1
  inputs:
    - id: waste_container
      quantity: 20.0
  outputs:
    - id: waste
      quantity: 20.0
  power_draw: 3.0

- id: grow_rations
  name: Grow Rations
  building: hydroponic_bay
  cycle_sols: 1
  inputs:
    - id: water
      quantity: 2.0
  outputs:
    - id: food_ration
      quantity: 12.0
    - id: biomass
      quantity: 3.0

- id: smelt_iron
  name: Smelt Iron
  building: smelter
  cycle_sols: 2
  inputs:
    - id: structural_ore
      quantity: 2.0
  outputs:
    - id: structural_metal
      quantity: 1.0

- id: conduct_research
