# colony_hq's recipes are all `concurrent: true` — they always run together
# every turn (see production.rs's module doc comment), rather than
# `active_recipes` picking one. The power/water/oxygen outputs mirror
# generate_power_solar_mk1 / pump_water / scrub_oxygen exactly, so colony_hq is
# a drop-in slot-efficient alternative to building all three standalone
# structures; hq_conduct_research below adds a research trickle those three
# have no equivalent for.
- id: hq_generate_power
  name: Generate Power (Colony HQ)
  building: colony_hq
  cycle_sols: 1
  inputs: []
  outputs:
    - id: power
      quantity: 24.0
  concurrent: true

- id: hq_pump_water
  name: Pump Water (Colony HQ)
  building: colony_hq
  cycle_sols: 1
  inputs: []
  outputs:
    - id: water
      quantity: 24.0
  concurrent: true

- id: hq_scrub_oxygen
  name: Scrub Oxygen (Colony HQ)
  building: colony_hq
  cycle_sols: 1
  inputs: []
  outputs:
    - id: oxygen
      quantity: 7.0
  concurrent: true

# Administrative research trickle (issue #310). Without this, research is
# unreachable through ordinary colony production: the only two buildings that
# output `research` are research_lab (gated behind basic_construction, itself
# 100 RP) and physics_lab (deeper still), so a fresh colony could never earn
# the first tech — the sole alternative source is a lucky survey-expedition
# anomaly (anomalies.yaml `research_bonus`).
#
# 1 RP/sol is deliberately one fifth of research_lab's conduct_research (5
# RP/sol): basic_construction's 100 RP lands in ~100 sols on HQ alone versus
# ~17 with one lab, so labs stay clearly worth building. No inputs and no
# power_draw of its own — like the other three hq_* recipes, it rides the
# building's `power_delta: -13.0` and worker slots, so it is still throttled
# by the HQ's shared scale rather than being unconditionally free. Notably it
# takes no water, so it can't compete with hq_pump_water the way
# research_lab's 1.0-water input would.
- id: hq_conduct_research
  name: Baseline Research (Colony HQ)
  building: colony_hq
  cycle_sols: 1
  inputs: []
  outputs:
    - id: research
      quantity: 1.0
  concurrent: true

# Baseline networking_compute trickle. Morale's sole input (outpost_core's
# morale.rs, issue #382) was, before this recipe existed, produced by no
# starter-kit building at all — only comms_hub does, and it needs the
# automation tech — so every colony's composite_satisfaction sat at a flat
# 0.0 from sol one, guaranteeing morale a ~20-sol crash to zero regardless
# of production, employment, or buildings, on every difficulty (playtest
# report: "resource production was positive, and I had all the starter
# buildings" and morale still tanked).
#
# 5.0/sol is deliberately a quarter of comms_hub's dedicated 20.0/sol
# (operate_comms_hub): at morale's demand rate (0.1/colonist), it fully
# satisfies a 50-pop colony and gets a 100-pop colony to the exact
# gain/loss breakeven (recovery_rate == decay_rate == 0.05, both quadratic
# in satisfaction, cross at satisfaction 0.5) — enough that morale holds
# roughly steady for a modest starter colony instead of guaranteed-crashing,
# without fully solving satisfaction the way comms_hub does. A colony that
# grows past that, or wants morale actually *rising*, still needs
# automation + comms_hub — this narrows the gap, it doesn't close it.
- id: hq_operate_baseline_comms
  name: Baseline Comms (Colony HQ)
  building: colony_hq
  cycle_sols: 1
  inputs: []
  outputs:
    - id: networking_compute
      quantity: 5.0
  concurrent: true

