# ── Colonization goods (issue #359) ──────────────────────────────────────────
#
# All three sit on the `manufactory` (the heaviest assembly building), and all
# three draw on chains authored across #207-#225 — structural and conductive
# metals, electronic components, composites. Expansion therefore requires a
# broadly developed economy, not one deep specialised line.

- id: assemble_survey_probe
  name: Assemble Survey Probe
  building: manufactory
