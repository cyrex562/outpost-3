- id: excavate_structural_ore
  name: Excavate Structural Ore
  building: excavation_rig
  cycle_sols: 1
  inputs: []
  outputs:
    - id: structural_ore
      quantity: 10.0

# fabrication_complex runs one of these two at a time (active_recipes
# selection, issue #166) — sorted-first default is foundry_smelt_ore.
- id: foundry_smelt_ore
  name: Smelt Ore (Foundry)
  building: fabrication_complex
  cycle_sols: 1
  inputs:
    - id: structural_ore
      quantity: 5.0
  outputs:
