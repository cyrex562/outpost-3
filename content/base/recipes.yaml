# Production recipe definitions for the base-colony pack.

- id: smelt_iron
  name: Smelt Iron
  building: smelter
  cycle_sols: 2
  inputs:
    - id: iron_ore
      quantity: 2.0
  outputs:
    - id: iron_plate
      quantity: 1.0

- id: conduct_research
  name: Conduct Research
  building: research_lab
  cycle_sols: 1
  inputs:
    - id: water
      quantity: 1.0
  outputs:
    - id: research
      quantity: 5.0

- id: grow_rations
  name: Grow Rations
  building: hydroponic_bay
  cycle_sols: 3
  inputs:
    - id: water
      quantity: 3.0
  outputs:
    - id: food_ration
      quantity: 5.0
