# Production recipe definitions for the base-colony pack (issue #166).
#
# Passive/infrastructure buildings (warehouse, trade_depot, sensor_array) are
# intentionally absent — see their descriptions in buildings.yaml for why.

# ── Starter set ──────────────────────────────────────────────────────────────

- id: pump_water
  name: Pump Water
  building: water_well
  cycle_sols: 1
  inputs: []
  outputs:
    - id: water
      quantity: 24.0

- id: grow_rations
  name: Grow Rations
  building: hydroponic_bay
  cycle_sols: 1
  inputs:
    - id: water
      quantity: 2.0
  outputs:
    - id: food_ration
      quantity: 12.0
    - id: biomass
      quantity: 3.0

- id: smelt_iron
  name: Smelt Iron
  building: smelter
  cycle_sols: 2
  inputs:
    - id: structural_ore
      quantity: 2.0
  outputs:
    - id: structural_metal
      quantity: 1.0

- id: conduct_research
  name: Conduct Research
  building: research_lab
  cycle_sols: 1
  inputs:
    - id: water
      quantity: 1.0
  outputs:
    - id: research
      quantity: 5.0

- id: house_colonists_basic
  name: House Colonists (Basic)
  building: basic_habitat
  cycle_sols: 1
  inputs: []
  outputs:
    - id: housing
      quantity: 110.0

- id: generate_power_solar_mk1
  name: Generate Power (Solar Mk1)
  building: solar_array_mk1
  cycle_sols: 1
  inputs: []
  outputs:
    - id: power
      quantity: 24.0

- id: scrub_oxygen
  name: Scrub Oxygen
  building: life_support_module
  cycle_sols: 1
  inputs: []
  outputs:
    - id: oxygen
      quantity: 7.0

