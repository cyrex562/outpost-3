# Gas extractor: two recipes, one building — the recipe-selection mechanic
# (issue #166, issue #214).
- id: extract_fusion_fuel
  name: Extract Fusion Fuel
  building: gas_extractor
  cycle_sols: 1
  inputs: []
  outputs:
    - id: fusion_fuel
