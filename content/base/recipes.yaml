# ── Tier 2 ───────────────────────────────────────────────────────────────────

- id: house_colonists_apartment
  name: House Colonists (Apartment)
  building: apartment_block
  cycle_sols: 1
  inputs: []
  outputs:
    - id: housing
      quantity: 30.0

# Refinery: three recipes, one building — the recipe-selection mechanic
# (issue #166; conductive recipe added in #207). "refine_ore_to_plate" sorts
# before "refine_plate_to_components" and "smelt_conductive_ore"
# alphabetically, so it stays the deterministic default when the player
# hasn't picked one via Command::SetActiveRecipe.
- id: refine_ore_to_plate
  name: Refine Ore to Plate
  building: refinery
  cycle_sols: 1
  inputs:
    - id: structural_ore
      quantity: 5.0
  outputs:
    - id: structural_metal
      quantity: 4.0

- id: refine_plate_to_components
  name: Refine Plate to Components
  building: refinery
  cycle_sols: 2
  inputs:
    - id: structural_metal
      quantity: 3.0
  outputs:
    - id: components
      quantity: 2.0

- id: smelt_conductive_ore
  name: Smelt Conductive Ore
  building: refinery
  cycle_sols: 1
  inputs:
    - id: conductive_ore
      quantity: 4.0
  outputs:
    - id: conductive_metal
      quantity: 3.0

- id: mine_conductive_ore
  name: Mine Conductive Ore
  building: conductive_mine
  cycle_sols: 1
  inputs: []
  outputs:
    - id: conductive_ore
      quantity: 8.0

- id: mine_precious_ore
  name: Mine Precious Ore
  building: precious_mine
  cycle_sols: 1
  inputs: []
  outputs:
    - id: precious_ore
      quantity: 3.0

- id: refine_precious_ore
  name: Refine Precious Ore
  building: precious_refinery
  cycle_sols: 2
  inputs:
    - id: precious_ore
      quantity: 3.0
  outputs:
    - id: precious_metal
      quantity: 2.0

# Petrochemical plant: three recipes, one building — the recipe-selection
# mechanic (issue #166, issue #210).
- id: refine_fuel
  name: Refine Fuel
  building: petrochemical_plant
  cycle_sols: 1
  inputs:
    - id: hydrocarbons
      quantity: 4.0
  outputs:
    - id: fuel
      quantity: 3.0

- id: refine_plastics
  name: Refine Plastics
  building: petrochemical_plant
  cycle_sols: 1
  inputs:
    - id: hydrocarbons
      quantity: 3.0
  outputs:
    - id: plastics
      quantity: 2.0

- id: refine_chemicals
  name: Refine Chemicals
  building: petrochemical_plant
  cycle_sols: 1
  inputs:
    - id: hydrocarbons
      quantity: 3.0
  outputs:
    - id: chemicals
      quantity: 2.0

- id: treat_water
