# Refinery: two recipes, one building — the recipe-selection mechanic
# (issue #166). "refine_ore_to_plate" sorts before "refine_plate_to_components"
# alphabetically, so it's the deterministic default when the player hasn't
# picked one via Command::SetActiveRecipe.
- id: refine_ore_to_plate
  name: Refine Ore to Plate
  building: refinery
  cycle_sols: 1
  inputs:
    - id: iron_ore
      quantity: 5.0
  outputs:
    - id: iron_plate
      quantity: 4.0

- id: refine_plate_to_components
  name: Refine Plate to Components
  building: refinery
  cycle_sols: 2
  inputs:
    - id: iron_plate
      quantity: 3.0
  outputs:
    - id: components
      quantity: 2.0

- id: treat_water
  name: Treat Water
  building: water_treatment_plant
  cycle_sols: 1
  inputs: []
  outputs:
    - id: water
      quantity: 35.0

- id: generate_power_solar_mk2
  name: Generate Power (Solar Mk2)
  building: solar_array_mk2
  cycle_sols: 1
  inputs: []
  outputs:
    - id: power
      quantity: 20.0

