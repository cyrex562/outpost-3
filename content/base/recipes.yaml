    - id: refractory_metal
      quantity: 2.0

# "synthesize_carbon_composites" deliberately sorts after
# "refine_refractory_ore" alphabetically ('r' < 's'), so adding it
# doesn't change the refractory_foundry's deterministic default recipe
# for existing colonies that never called SetActiveRecipe (issue #166's
# recipe-selection invariant, issue #216).
- id: synthesize_carbon_composites
  name: Synthesize Carbon Composites
  building: refractory_foundry
  cycle_sols: 2
  inputs:
    - id: carbon
      quantity: 4.0
  outputs:
