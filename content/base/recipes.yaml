# Food processing plant: two recipes, one building — the recipe-selection
# mechanic (issue #166, issue #211). Both consume the biomass byproduct
# from hydroponic_bay's grow_rations recipe.
- id: ferment_protein_rations
  name: Ferment Protein Rations
  building: food_processing_plant
  cycle_sols: 1
  inputs:
    - id: biomass
      quantity: 5.0
  outputs:
    - id: protein_rations
      quantity: 3.0

- id: press_produce_rations
  name: Press Produce Rations
  building: food_processing_plant
  cycle_sols: 1
  inputs:
    - id: biomass
      quantity: 4.0
  outputs:
    - id: produce_rations
      quantity: 3.0

- id: generate_power_solar_mk2
  name: Generate Power (Solar Mk2)
  building: solar_array_mk2
  cycle_sols: 1
  inputs: []
  outputs:
    - id: power
      quantity: 20.0

# ── Tier 3 ───────────────────────────────────────────────────────────────────

- id: mine_refractory_ore
  name: Mine Refractory Ore
  building: refractory_mine
  cycle_sols: 1
  inputs: []
  outputs:
