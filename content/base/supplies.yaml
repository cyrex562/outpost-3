# Starter supply packages selectable during colony founding.
#
# Quantities below are per-100-colonists and are scaled linearly by
# `starting_population / 100.0` when applied. The three tiers span from
# hand-to-mouth ("Lean") through a comfortable-with-construction-buffer
# start ("Standard") to a long runway with expansion materials ("Stockpile").
#
# Only commodities present in `commodities.yaml` may be referenced.

- id: lean
  name: Lean
  description: >
    Roughly ten sols of survival at reference size. Bring skill, not stuff.
  commodities:
    - id: water
      quantity: 150.0
    - id: food_ration
      quantity: 100.0
    - id: structural_metal
      quantity: 5.0
    - id: power_cell
      quantity: 5.0

- id: standard
  name: Standard
  description: >
    About twenty sols of survival plus enough iron plate to erect
    a starter building or two before the first supply run.
  commodities:
    - id: water
      quantity: 400.0
    - id: food_ration
      quantity: 300.0
    - id: structural_metal
      quantity: 50.0
    - id: power_cell
      quantity: 20.0

- id: stockpile
  name: Stockpile
  description: >
    Approximately forty sols of survival with a healthy iron plate and
    power cell reserve for early expansion.
  commodities:
    - id: water
      quantity: 900.0
    - id: food_ration
      quantity: 600.0
    - id: structural_metal
      quantity: 150.0
    - id: power_cell
      quantity: 60.0
