# Base-colony commodity definitions.
# All authored records live here — never hardcoded in kernel code.

- id: water
  name: Water
  description: >
    Potable water is the most essential survival resource.
    Harvested from ice deposits or atmospheric condensation.
  category: consumable
  phase: liquid
  base_value: 5.0
  tradeable: true

- id: food_ration
  name: Food Ration
  description: >
    Compact, shelf-stable ration block — the colony's tracked survival
    need (`outpost_core/src/needs.rs`). Produced by hydroponic bays
    alongside a biomass byproduct and distributed to the colony population
    each sol (issue #211: biomass byproduct added; needs-system tracking
    unchanged — see `biomass`'s description for why).
  category: consumable
  phase: solid
  base_value: 8.0
  tradeable: true

- id: biomass
  name: Biomass
  description: >
    Raw harvested plant matter — a byproduct of `hydroponic_bay`'s
    `grow_rations` recipe alongside its primary `food_ration` output
    (mirrors the `structural_mine`/`waste_rock` byproduct pattern). Feeds
    tech-gated distinct-foodstuff recipes (`protein_rations`,
    `produce_rations`) as separate tradeable end-items in their own
    right — not merged back into `food_ration`, so the starter-set
    survival bar #166 established is untouched by this issue (issue #211,
    resolving `docs/DESIGN.md`'s "several distinct foodstuffs" TBD). A
    diet-variety stability bonus was considered and explicitly deferred —
    no `outpost_core/src/needs.rs` changes here — pending real
    playtesting signal on the right weight, matching #209's precedent for
    consumer_goods/luxury_goods.
  category: raw_material
  phase: solid
  base_value: 4.0
  tradeable: true

- id: protein_rations
  name: Protein Rations
  description: >
    Cultured/fermented protein foodstuff, distinct from the staple
    `food_ration` — a tradeable end-item, not a needs-system input this
    iteration (issue #211).
  category: consumable
  phase: solid
  base_value: 14.0
  tradeable: true

- id: produce_rations
  name: Produce Rations
  description: >
    Fresh-pressed fruit/vegetable foodstuff, distinct from the staple
    `food_ration` — a tradeable end-item, not a needs-system input this
    iteration (issue #211).
  category: consumable
  phase: solid
  base_value: 12.0
  tradeable: true

- id: structural_ore
  name: Structural Ore
  description: >
    Iron/nickel-family ore extracted from surface deposits — abundant,
    cheap, high-volume. The colony's primary construction feedstock
    (issue #207; formerly "iron_ore").
  category: metallic_ore
  phase: solid
  base_value: 10.0
  tradeable: true

- id: structural_metal
  name: Structural Metal
  description: >
    Refined structural-grade sheeting produced by the smelter or refinery.
    Used in nearly every building's construction cost (issue #207;
    formerly "iron_plate").
  category: metal
  phase: solid
  base_value: 25.0
  tradeable: true

- id: conductive_ore
  name: Conductive Ore
  description: >
    Copper/aluminum-family ore, mined for its electrical conductivity.
    Feedstock for power and electronics infrastructure (issue #207).
  category: metallic_ore
  phase: solid
  base_value: 15.0
  tradeable: true

- id: conductive_metal
  name: Conductive Metal
  description: >
    Refined high-conductivity metal, used in power and electronics
    manufacturing (issue #207).
  category: metal
  phase: solid
  base_value: 35.0
  tradeable: true

- id: precious_ore
  name: Precious Ore
  description: >
    Gold/platinum/rare-earth-family ore — low yield, high value. Feedstock
    for high-tier electronics, luxury goods, and currency (issue #207).
  category: metallic_ore
  phase: solid
  base_value: 60.0
  tradeable: true

- id: precious_metal
  name: Precious Metal
  description: >
    Refined precious metal, carefully processed in small batches
    (issue #207).
  category: metal
  phase: solid
  base_value: 150.0
  tradeable: true

- id: refractory_ore
  name: Refractory Ore
  description: >
    Titanium/tungsten-family ore, prized for high-temperature and
    high-strength applications. Harder to process than structural ore
    (issue #207).
  category: metallic_ore
  phase: solid
  base_value: 40.0
  tradeable: true

- id: refractory_metal
  name: Refractory Metal
  description: >
    Refined refractory-grade metal — energy-intensive to produce, used in
    advanced-tier construction and equipment (issue #207).
  category: metal
  phase: solid
  base_value: 100.0
  tradeable: true

- id: mechanical_components
  name: Mechanical Components
  description: >
    Machined structural/conductive-metal parts — gears, housings, fasteners —
    used in mid-tier manufacturing recipes (issue #208).
  category: manufactured
  phase: solid
  base_value: 60.0
  tradeable: true

- id: electronic_components
  name: Electronic Components
  description: >
    Conductive- and precious-metal circuitry for control systems and
    instrumentation, now cased/insulated with plastics (issue #210, closing
    the gap #208 left open). Real electronics manufacturing also needs
    semiconductor feedstock; this recipe still lacks that until #216
    (carbon & semiconductor materials) ships, at which point it should be
    updated to also consume `semiconductors`.
  category: manufactured
  phase: solid
  base_value: 90.0
  tradeable: true

- id: alloys
  name: Alloys
  description: >
    Structural/refractory-metal composite blend for high-tier construction
    and advanced buildings (issue #208).
  category: manufactured
  phase: solid
  base_value: 80.0
  tradeable: true

- id: consumer_goods
  name: Consumer Goods
  description: >
    Generic finished goods assembled from mechanical/electronic components —
    tools, appliances, everyday manufactured items. A tradeable end-item
    sink; not yet wired into the needs/stability system (issue #209 —
    deferred: adding a mandatory per-capita need here would require
    re-tuning every existing colony config and balance-harness bundle,
    since no starter building produces it. Revisit once there's real
    playtesting signal on the right weight relative to survival needs).
  category: consumer_good
  phase: solid
  base_value: 120.0
  tradeable: true

- id: luxury_goods
  name: Luxury Goods
  description: >
    High-value finished goods gated behind precious metal — the user's own
    reference point is "whiskey or alcohol in general": one commodity id
    covers whatever the colony is narratively producing (aged spirits, fine
    textiles, art), matching the category-not-SKU principle from #207.
    Same trade-sink status as consumer_goods for now (issue #209).
  category: luxury_good
  phase: solid
  base_value: 350.0
  tradeable: true

- id: hydrocarbons
  name: Hydrocarbons
  description: >
    Crude oil/natural-gas family feedstock, pumped from subsurface
    deposits — the raw input for the fuel/plastics/chemicals refining
    chain (issue #210).
  category: raw_material
  phase: liquid
  base_value: 12.0
  tradeable: true

- id: fuel
  name: Fuel
  description: >
    Refined hydrocarbon fuel — powers vehicles and high-tier generators.
    No engine mechanic currently consumes it (no vehicle/expedition-cost or
    generator-fuel system exists yet); producible and tradeable now, wired
    up to a real consumer once one of those mechanics lands (issue #210).
  category: chemical
  phase: liquid
  base_value: 30.0
  tradeable: true

- id: plastics
  name: Plastics
  description: >
    Refined hydrocarbon polymer feedstock — feeds electronic-component and
    other manufacturing recipes. Now a required input to
    `electronic_components` alongside conductive/precious metal (issue
    #210, closing the gap #208 left for this).
  category: chemical
  phase: solid
  base_value: 20.0
  tradeable: true

- id: chemicals
  name: Chemicals
  description: >
    Refined industrial chemicals — feeds manufacturing recipes and,
    optionally, life-support processes. No life-support recipe consumes it
    yet in this iteration (issue #210); a plausible future tie-in per
    #166's life_support building category.
  category: chemical
  phase: liquid
  base_value: 25.0
  tradeable: true

- id: power_cell
  name: Power Cell
  description: >
    Rechargeable solid-state power cell.  Powers hand tools
    and light equipment; currency substitute in frontier zones.
  category: energy
  phase: solid
  base_value: 20.0
  tradeable: true

- id: research
  name: Research
  description: >
    Abstract unit of scientific output produced by research labs.
    Pooled system-wide and spent to unlock technologies.
    No weight, no storage cap — a virtual flow commodity.
  category: virtual
  phase: solid
  base_value: 0.0
  tradeable: false
  tier: advanced
  weight: 0.0

- id: oxygen
  name: Oxygen
  description: >
    Breathable atmosphere stock, harvested or scrubbed for the colony's
    life-support system. Consumed per capita each sol (issue #166).
  category: consumable
  phase: gas
  base_value: 6.0
  tradeable: false
  weight: 0.2

- id: housing
  name: Housing Capacity
  description: >
    Abstract unit of livable space. Not consumed — the colony pool just
    needs to hold at least one unit per colonist (issue #166).
  category: virtual
  phase: solid
  base_value: 0.0
  tradeable: false
  weight: 0.0

- id: power
  name: Power
  description: >
    Electricity routed to habitat life-support systems. Distinct from a
    building's power_delta (which feeds the industrial grid ratio) — this
    is the population's per-capita household draw (issue #166).
  category: energy
  phase: solid
  base_value: 0.0
  tradeable: false
  weight: 0.0

- id: components
  name: Components
  description: >
    Machined parts fabricated from refined metal, used in higher-tier
    manufacturing recipes.
  category: manufactured
  phase: solid
  base_value: 40.0
  tradeable: true

- id: waste_rock
  name: Waste Rock
  description: >
    Low-value tailings and overburden from mining operations. Bulky but
    cheap; a byproduct rather than a primary extraction target.
  category: raw_material
  phase: solid
  base_value: 1.0
  tradeable: true
  weight: 2.0

- id: trace_minerals
  name: Trace Minerals
  description: >
    Low-concentration rare elements captured as a byproduct of
    atmospheric extraction.
  category: raw_material
  phase: solid
  base_value: 15.0
  tradeable: true

- id: noble_gases
  name: Noble Gases
  description: >
    Helium/neon/argon/xenon family, extracted from atmosphere or
    subsurface deposits — one category commodity rather than a gas per
    element (issue #214). Shielding gas for electronics/component
    manufacturing, ion-propulsion/thruster flavor, cryogenics. No
    engine-mechanic consumer yet — producible/tradeable now, same hedge
    used for #210's `fuel`.
  category: raw_material
  phase: gas
  base_value: 18.0
  tradeable: true
  weight: 0.1

- id: fusion_fuel
  name: Fusion Fuel
  description: >
    Deuterium/tritium/helium-3 family — kept as a single lightly-processed
    commodity rather than splitting a raw→refined chain, since the
    isotope-separation detail doesn't add meaningful gameplay depth at
    this tier (issue #214, matching the "don't overdo the granularity"
    judgment call already used for #216's raw materials). The
    `fusion_reactor_prototype`'s `generate_power_fusion` recipe now
    consumes this instead of running on zero inputs.
  category: raw_material
  phase: gas
  base_value: 45.0
  tradeable: true
  weight: 0.1
