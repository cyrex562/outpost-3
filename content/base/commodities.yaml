# Base-colony commodity definitions.
# All authored records live here — never hardcoded in kernel code.

- id: water
  name: Water
  description: >
    Potable water is the most essential survival resource.
    Harvested from ice deposits or atmospheric condensation.
  category: consumable
  phase: liquid
  base_value: 5.0
  tradeable: true

- id: food_ration
  name: Food Ration
  description: >
    Compact, shelf-stable ration block — the colony's tracked survival
    need (`outpost_core/src/needs.rs`). Produced by hydroponic bays
    alongside a biomass byproduct and distributed to the colony population
    each sol (issue #211: biomass byproduct added; needs-system tracking
    unchanged — see `biomass`'s description for why).
  category: consumable
  phase: solid
  base_value: 8.0
  tradeable: true

- id: biomass
  name: Biomass
  description: >
    Raw harvested plant matter — a byproduct of `hydroponic_bay`'s
    `grow_rations` recipe alongside its primary `food_ration` output
    (mirrors the `structural_mine`/`waste_rock` byproduct pattern). Feeds
    tech-gated distinct-foodstuff recipes (`protein_rations`,
    `produce_rations`) as separate tradeable end-items in their own
    right — not merged back into `food_ration`, so the starter-set
    survival bar #166 established is untouched by this issue (issue #211,
    resolving `docs/DESIGN.md`'s "several distinct foodstuffs" TBD). A
    diet-variety stability bonus was considered and explicitly deferred —
    no `outpost_core/src/needs.rs` changes here — pending real
    playtesting signal on the right weight, matching #209's precedent for
    consumer_goods/luxury_goods.
  category: raw_material
  phase: solid
  base_value: 4.0
  tradeable: true

- id: protein_rations
  name: Protein Rations
  description: >
    Cultured/fermented protein foodstuff, distinct from the staple
    `food_ration` — a tradeable end-item, not a needs-system input this
    iteration (issue #211).
  category: consumable
  phase: solid
  base_value: 14.0
  tradeable: true

- id: produce_rations
  name: Produce Rations
  description: >
    Fresh-pressed fruit/vegetable foodstuff, distinct from the staple
    `food_ration` — a tradeable end-item, not a needs-system input this
    iteration (issue #211).
  category: consumable
  phase: solid
  base_value: 12.0
  tradeable: true

- id: structural_ore
  name: Structural Ore
  description: >
    Iron/nickel-family ore extracted from surface deposits — abundant,
    cheap, high-volume. The colony's primary construction feedstock
    (issue #207; formerly "iron_ore").
  category: metallic_ore
  phase: solid
  base_value: 10.0
  tradeable: true

- id: structural_metal
  name: Structural Metal
  description: >
    Refined structural-grade sheeting produced by the smelter or refinery.
    Used in nearly every building's construction cost (issue #207;
    formerly "iron_plate").
  category: metal
  phase: solid
  base_value: 25.0
  tradeable: true

- id: conductive_ore
  name: Conductive Ore
  description: >
    Copper/aluminum-family ore, mined for its electrical conductivity.
    Feedstock for power and electronics infrastructure (issue #207).
  category: metallic_ore
  phase: solid
  base_value: 15.0
  tradeable: true

- id: conductive_metal
  name: Conductive Metal
  description: >
    Refined high-conductivity metal, used in power and electronics
    manufacturing (issue #207).
  category: metal
  phase: solid
  base_value: 35.0
  tradeable: true

- id: precious_ore
  name: Precious Ore
  description: >
    Gold/platinum/rare-earth-family ore — low yield, high value. Feedstock
    for high-tier electronics, luxury goods, and currency (issue #207).
  category: metallic_ore
  phase: solid
  base_value: 60.0
  tradeable: true

- id: precious_metal
  name: Precious Metal
  description: >
    Refined precious metal, carefully processed in small batches
    (issue #207).
  category: metal
  phase: solid
  base_value: 150.0
  tradeable: true

- id: refractory_ore
  name: Refractory Ore
  description: >
    Titanium/tungsten-family ore, prized for high-temperature and
    high-strength applications. Harder to process than structural ore
    (issue #207).
  category: metallic_ore
  phase: solid
  base_value: 40.0
  tradeable: true

- id: refractory_metal
  name: Refractory Metal
  description: >
    Refined refractory-grade metal — energy-intensive to produce, used in
    advanced-tier construction and equipment (issue #207).
  category: metal
  phase: solid
  base_value: 100.0
  tradeable: true

- id: mechanical_components
  name: Mechanical Components
  description: >
    Machined structural/conductive-metal parts — gears, housings, fasteners —
    used in mid-tier manufacturing recipes (issue #208).
  category: manufactured
  phase: solid
  base_value: 60.0
  tradeable: true

- id: electronic_components
  name: Electronic Components
  description: >
    Conductive- and precious-metal circuitry for control systems and
    instrumentation, cased/insulated with plastics (issue #210) and now
    built on real semiconductor feedstock (issue #216, closing the gap
    #208 left open).
  category: manufactured
  phase: solid
  base_value: 90.0
  tradeable: true

- id: alloys
  name: Alloys
  description: >
    Structural/refractory-metal composite blend for high-tier construction
    and advanced buildings (issue #208).
  category: manufactured
  phase: solid
  base_value: 80.0
  tradeable: true

- id: consumer_goods
  name: Consumer Goods
  description: >
    Generic finished goods assembled from mechanical/electronic components —
    tools, appliances, everyday manufactured items. A tradeable end-item
    sink; not yet wired into the needs/stability system (issue #209 —
    deferred: adding a mandatory per-capita need here would require
    re-tuning every existing colony config and balance-harness bundle,
    since no starter building produces it. Revisit once there's real
    playtesting signal on the right weight relative to survival needs).
  category: consumer_good
  phase: solid
  base_value: 120.0
  tradeable: true

- id: luxury_goods
  name: Luxury Goods
  description: >
    High-value finished goods gated behind precious metal — the user's own
    reference point is "whiskey or alcohol in general": one commodity id
    covers whatever the colony is narratively producing (aged spirits, fine
    textiles, art), matching the category-not-SKU principle from #207.
    Same trade-sink status as consumer_goods for now (issue #209).
  category: luxury_good
  phase: solid
  base_value: 350.0
  tradeable: true

- id: hydrocarbons
  name: Hydrocarbons
  description: >
    Crude oil/natural-gas family feedstock, pumped from subsurface
    deposits — the raw input for the fuel/plastics/chemicals refining
    chain (issue #210).
  category: raw_material
  phase: liquid
  base_value: 12.0
  tradeable: true

- id: fuel
  name: Fuel
  description: >
    Refined hydrocarbon fuel — powers vehicles and high-tier generators.
    No engine mechanic currently consumes it (no vehicle/expedition-cost or
    generator-fuel system exists yet); producible and tradeable now, wired
    up to a real consumer once one of those mechanics lands (issue #210).
  category: chemical
  phase: liquid
  base_value: 30.0
  tradeable: true

- id: plastics
  name: Plastics
  description: >
    Refined hydrocarbon polymer feedstock — feeds electronic-component and
    other manufacturing recipes. Now a required input to
    `electronic_components` alongside conductive/precious metal (issue
    #210, closing the gap #208 left for this).
  category: chemical
  phase: solid
  base_value: 20.0
  tradeable: true

- id: chemicals
  name: Chemicals
  description: >
    Refined industrial chemicals — feeds manufacturing recipes and,
    optionally, life-support processes. No life-support recipe consumes it
    yet in this iteration (issue #210); a plausible future tie-in per
    #166's life_support building category.
  category: chemical
  phase: liquid
  base_value: 25.0
  tradeable: true

- id: power_cell
  name: Power Cell
  description: >
    Rechargeable solid-state power cell.  Powers hand tools
    and light equipment; currency substitute in frontier zones.
  category: energy
  phase: solid
  base_value: 20.0
  tradeable: true

- id: research
  name: Research
  description: >
    Abstract unit of scientific output produced by research labs.
    Pooled system-wide and spent to unlock technologies.
    No weight, no storage cap — a virtual flow commodity.
  category: virtual
  phase: solid
  base_value: 0.0
  tradeable: false
  tier: advanced
  weight: 0.0

- id: oxygen
  name: Oxygen
  description: >
    Breathable atmosphere stock, harvested or scrubbed for the colony's
    life-support system. Consumed per capita each sol (issue #166).
  category: consumable
  phase: gas
  base_value: 6.0
  tradeable: false
  weight: 0.2

- id: housing
  name: Housing Capacity
  description: >
    Abstract unit of livable space. Not consumed — the colony pool just
    needs to hold at least one unit per colonist (issue #166).
  category: virtual
  phase: solid
  base_value: 0.0
  tradeable: false
  weight: 0.0

- id: power
  name: Power
  description: >
    Electricity routed to habitat life-support systems. Distinct from a
    building's power_delta (which feeds the industrial grid ratio) — this
    is the population's per-capita household draw (issue #166).
  category: energy
  phase: solid
  base_value: 0.0
  tradeable: false
  weight: 0.0

- id: components
  name: Components
  description: >
    Machined parts fabricated from refined metal, used in higher-tier
    manufacturing recipes.
  category: manufactured
  phase: solid
  base_value: 40.0
  tradeable: true

- id: waste_rock
  name: Waste Rock
  description: >
    Low-value tailings and overburden from mining operations. Bulky but
    cheap; a byproduct rather than a primary extraction target.
  category: raw_material
  phase: solid
  base_value: 1.0
  tradeable: true
  weight: 2.0

- id: trace_minerals
  name: Trace Minerals
  description: >
    Low-concentration rare elements captured as a byproduct of
    atmospheric extraction.
  category: raw_material
  phase: solid
  base_value: 15.0
  tradeable: true

- id: noble_gases
  name: Noble Gases
  description: >
    Helium/neon/argon/xenon family, extracted from atmosphere or
    subsurface deposits — one category commodity rather than a gas per
    element (issue #214). Shielding gas for electronics/component
    manufacturing, ion-propulsion/thruster flavor, cryogenics. No
    engine-mechanic consumer yet — producible/tradeable now, same hedge
    used for #210's `fuel`.
  category: raw_material
  phase: gas
  base_value: 18.0
  tradeable: true
  weight: 0.1

- id: fusion_fuel
  name: Fusion Fuel
  description: >
    Deuterium/tritium/helium-3 family — kept as a single lightly-processed
    commodity rather than splitting a raw→refined chain, since the
    isotope-separation detail doesn't add meaningful gameplay depth at
    this tier (issue #214, matching the "don't overdo the granularity"
    judgment call already used for #216's raw materials). The
    `fusion_reactor_prototype`'s `generate_power_fusion` recipe now
    consumes this instead of running on zero inputs.
  category: raw_material
  phase: gas
  base_value: 45.0
  tradeable: true
  weight: 0.1

- id: fissile_ore
  name: Fissile Ore
  description: >
    Uranium/thorium-family ore, mined from subsurface deposits — the raw
    feedstock for nuclear fuel enrichment (issue #215).
  category: metallic_ore
  phase: solid
  base_value: 50.0
  tradeable: true

- id: nuclear_fuel
  name: Nuclear Fuel
  description: >
    Enriched/refined fissile material — powers a fission_reactor (issue
    #215). Fills the tier-2 power gap between solar/wind (tier 1) and
    fusion (tier 3, #166) that was in the original #166 brainstorm but
    never shipped.
  category: metal
  phase: solid
  base_value: 120.0
  tradeable: true

- id: radioactive_waste
  name: Radioactive Waste
  description: >
    Spent fuel byproduct of running a fission_reactor (issue #215) — a
    byproduct of reactor OPERATION, not of refining nuclear_fuel (the
    refining step itself is modeled as clean; waste comes from burning
    the fuel). Resolved design (Q&A before implementing): pure
    tradeable/storable byproduct like `waste_rock` (#166), with no
    hazard-system consumer yet — extending `outpost_core/src/hazard.rs`'s
    `RadiationLeak` hazard kind to react to accumulated waste is a real
    engine mechanic, deferred pending playtesting signal, matching the
    established pattern for #209/#211's similar deferrals. `hazard.rs`
    is intentionally untouched by this issue.
  category: raw_material
  phase: solid
  base_value: 2.0
  tradeable: true
  weight: 1.5

- id: carbon
  name: Carbon
  description: >
    Atmosphere-captured elemental carbon — a byproduct of
    `atmospheric_harvester`'s `harvest_atmosphere` recipe (issue #166) and
    the starter-tier `air_miner`'s `mine_atmosphere_basic` recipe (landing-
    kit redesign, playtest feedback round 2), both alongside their primary
    oxygen output, rather than a new dedicated extractor (issue #216).
    Feedstock for `carbon_composites` and `chem_plant`'s `chemicals`.
  category: raw_material
  phase: solid
  base_value: 8.0
  tradeable: true

- id: semiconductor_ore
  name: Semiconductor Ore
  description: >
    Silicon-family raw feedstock, mined separately from `carbon` (issue
    #216 judgment call: kept as its own commodity rather than merged
    into `carbon`, since it feeds a chemically and functionally distinct
    downstream chain — electronics, not structural composites — matching
    the use-case-differentiated category principle from #207's metal
    families).
  category: metallic_ore
  phase: solid
  base_value: 30.0
  tradeable: true

- id: carbon_composites
  name: Carbon Composites
  description: >
    Carbon fiber/graphene composite — a lightweight high-strength
    alternative/complement to `refractory_metal`/`alloys` (#207/#208)
    for advanced construction (issue #216).
  category: manufactured
  phase: solid
  base_value: 140.0
  tradeable: true

- id: semiconductors
  name: Semiconductors
  description: >
    Refined silicon-family semiconductor material — critical input for
    real electronics manufacturing (issue #216). Closes the gap #208
    left open: `electronic_components` now requires this alongside
    conductive/precious metal and plastics.
  category: manufactured
  phase: solid
  base_value: 200.0
  tradeable: true

- id: silicates
  name: Silicates
  description: >
    Sand/quartz/clay-family minerals, mined in bulk (issue #225). Shared
    feedstock for `ceramics`, `glass`, and `crystals` below — kept as a
    single raw commodity rather than three separate ores, since they're
    fundamentally the same mineral family (matches the "don't overdo the
    granularity" judgment call #216 already applied to its own raw
    materials).
  category: raw_material
  phase: solid
  base_value: 6.0
  tradeable: true

- id: ceramics
  name: Ceramics
  description: >
    High-temperature, high-insulation material fired from `silicates`
    (issue #225) — an alternative or complement to `refractory_metal`
    (#207) for heat shielding, electronics substrates, and advanced
    construction. Gated at the same tier as `refractory_foundry`.
  category: manufactured
  phase: solid
  base_value: 35.0
  tradeable: true

- id: glass
  name: Glass
  description: >
    Melted and annealed `silicates` (issue #225) — feeds habitat glazing
    and windows, optics, and `fiber_optics` below.
  category: manufactured
  phase: solid
  base_value: 20.0
  tradeable: true

- id: composites
  name: Composites
  description: >
    Lightweight, high-strength material combining `ceramics` and
    `plastics` (#210) — a ceramic/glass-matrix composite (issue #225).
    Overlap resolved: kept as a distinct commodity from #216's
    `carbon_composites` rather than merged, since the two have chemically
    distinct precursor chains (silicates-based vs. carbon-based) and
    serve as sibling alternatives for advanced-construction material
    choice — the same use-case-differentiated category principle #216
    already applied when it kept `semiconductor_ore` separate from
    `carbon`. Both remain valid inputs to advanced-tier construction
    costs; nothing about `carbon_composites` changes here.
  category: manufactured
  phase: solid
  base_value: 130.0
  tradeable: true

- id: fiber_optics
  name: Fiber Optics
  description: >
    Drawn optical fiber, processed from `glass` (issue #225). A plausible
    future input for sensor/communications equipment (`sensor_array`,
    #166) — no consumer wired up yet; checked for existing consumers
    first and found none, same hedge #210 used for `fuel`.
  category: manufactured
  phase: solid
  base_value: 60.0
  tradeable: true

- id: crystals
  name: Crystals
  description: >
    Precision-grown optical/piezoelectric crystals, lightly processed
    from `silicates` in a single step (issue #225, matching #214's
    `fusion_fuel` "don't split a raw→refined chain when the extra step
    doesn't add gameplay depth" hedge). Overlap resolved: kept distinct
    from #216's `semiconductor_ore`/`semiconductors` chain rather than
    made a precursor to it — these are instrumentation/gemstone-grade
    crystals (a plausible `luxury_goods`, #209, input), not
    semiconductor-grade silicon, so they don't touch #216's already-
    shipped `semiconductor_fab` recipe. No consumer wired up yet, same
    hedge as `fiber_optics` above.
  category: raw_material
  phase: solid
  base_value: 90.0
  tradeable: true
