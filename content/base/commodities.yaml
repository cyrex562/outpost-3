# Base-colony commodity definitions.
# All authored records live here — never hardcoded in kernel code.

- id: water
  name: Water
  description: >
    Potable water is the most essential survival resource.
    Harvested from ice deposits or atmospheric condensation.
  category: consumable
  phase: liquid
  base_value: 5.0
  tradeable: true

- id: food_ration
  name: Food Ration
  description: >
    Compact, shelf-stable ration block.  Produced by hydroponic bays
    and distributed to the colony population each sol.
  category: consumable
  phase: solid
  base_value: 8.0
  tradeable: true

- id: iron_ore
  name: Iron Ore
  description: Raw iron ore extracted from surface deposits.
  category: metallic_ore
  phase: solid
  base_value: 10.0
  tradeable: true

- id: iron_plate
  name: Iron Plate
  description: Refined iron sheeting produced by the smelter.
  category: metal
  phase: solid
  base_value: 25.0
  tradeable: true

- id: power_cell
  name: Power Cell
  description: >
    Rechargeable solid-state power cell.  Powers hand tools
    and light equipment; currency substitute in frontier zones.
  category: energy
  phase: solid
  base_value: 20.0
  tradeable: true

- id: research
  name: Research
  description: >
    Abstract unit of scientific output produced by research labs.
    Pooled system-wide and spent to unlock technologies.
    No weight, no storage cap — a virtual flow commodity.
  category: virtual
  phase: solid
  base_value: 0.0
  tradeable: false
  tier: advanced
  weight: 0.0

- id: oxygen
  name: Oxygen
  description: >
    Breathable atmosphere stock, harvested or scrubbed for the colony's
    life-support system. Consumed per capita each sol (issue #166).
  category: consumable
  phase: gas
  base_value: 6.0
  tradeable: false
  weight: 0.2

- id: housing
  name: Housing Capacity
  description: >
    Abstract unit of livable space. Not consumed — the colony pool just
    needs to hold at least one unit per colonist (issue #166).
  category: virtual
  phase: solid
  base_value: 0.0
  tradeable: false
  weight: 0.0

- id: power
  name: Power
  description: >
    Electricity routed to habitat life-support systems. Distinct from a
    building's power_delta (which feeds the industrial grid ratio) — this
    is the population's per-capita household draw (issue #166).
  category: energy
  phase: solid
  base_value: 0.0
  tradeable: false
  weight: 0.0

- id: components
  name: Components
  description: >
    Machined parts fabricated from refined metal, used in higher-tier
    manufacturing recipes.
  category: manufactured
  phase: solid
  base_value: 40.0
  tradeable: true

- id: waste_rock
  name: Waste Rock
  description: >
    Low-value tailings and overburden from mining operations. Bulky but
    cheap; a byproduct rather than a primary extraction target.
  category: raw_material
  phase: solid
  base_value: 1.0
  tradeable: true
  weight: 2.0

- id: trace_minerals
  name: Trace Minerals
  description: >
    Low-concentration rare elements captured as a byproduct of
    atmospheric extraction.
  category: raw_material
  phase: solid
  base_value: 15.0
  tradeable: true
