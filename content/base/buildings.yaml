# Building definitions for the base-colony pack (issue #166).
#
# Categories: extraction, processing, power, housing, life_support, research,
# storage, services, defense. Buildings with no `tech_prerequisite` are the
# starter set, buildable immediately at colony founding — together they form
# a closed bootstrap loop (water, food, oxygen, housing, power, research) with
# no tech required; see content/checks/bootstrap_colony/ for the balance-
# harness proof. Everything else is gated by `tech_prerequisite` and unlocked
# progressively via content/base/tech.yaml.
#
# Buildings with no recipe are intentionally passive (pure power_delta/slot
# infrastructure) — each one below says why in its description.

# ── Starter set (no tech_prerequisite) ──────────────────────────────────────

- id: water_well
  name: Water Well
  description: >
    Draws groundwater or subsurface ice to the surface. The colony's most
    basic water source — available from first landing.
  category: extraction
  power_delta: 4.0
  worker_slots: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: hydroponic_bay
  name: Hydroponic Bay
  description: >
    Sealed growing chamber that produces food rations from water
    under artificial lighting.
  category: extraction
  power_delta: 5.0
  worker_slots: 1
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: smelter
  name: Smelter
  description: Converts raw metallic ore into refined plate stock.
  category: processing
  power_delta: 10.0
  worker_slots: 2
  construction_cost:
    - id: structural_metal
      quantity: 20.0

- id: research_lab
  name: Research Lab
  description: >
    Employs scientists to produce research output each sol,
    consuming labor and power.  Science is pooled system-wide
    and spent to unlock technologies (Phase 4b).
  category: research
  power_delta: 8.0
  worker_slots: 3
  slot_cost: 1
  construction_turns: 4
  construction_cost:
    - id: structural_metal
      quantity: 30.0

- id: basic_habitat
  name: Basic Habitat
  description: >
    Minimal pressurized bunks — the colony's first housing, available at
    founding so a landing party always has somewhere to shelter.
  category: housing
  power_delta: 1.0
  worker_slots: 0
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 15.0

- id: solar_array_mk1
  name: Solar Array Mk1
  description: Basic photovoltaic panel array. The colony's first power source.
  category: power
  power_delta: -20.0
  worker_slots: 0
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 12.0

- id: life_support_module
  name: Life Support Module
  description: >
    Compact atmosphere scrubber/generator — cheap, low-output baseline
    oxygen supply available from first landing. See atmospheric_harvester
    for a higher-throughput upgrade.
  category: life_support
  power_delta: 3.0
  worker_slots: 1
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 15.0

