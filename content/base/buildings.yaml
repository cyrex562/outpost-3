    containers back into usable water — a switchable pair of recipes
    (`bottle_water`/`unbottle_water`, recipes.yaml), not both at once. This
    is water's crating route (issue #348/#380): utilities move between
    colonies only once converted into a real commodity a convoy can carry,
    the same way power would need crating into charged cells.
  category: processing
  power_delta: 3.0
  worker_slots: 1
  default_priority: 6
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  tech_prerequisite: basic_construction
  construction_cost:
