    independent production lines (issue #272): the foundry smelts ore into
    structural metal while the machine shop machines metal into finished
    components. An ore shortage throttles the foundry without stopping the
    machine shop. Self-powered.
  category: processing
  starter_kit: true
  power_delta: -2.0
  worker_slots: 2
  default_priority: 7
  labor_required: 2
  slot_cost: 1
  construction_turns: 3
  construction_cost:
    - id: structural_metal
      quantity: 20.0

- id: air_miner
  name: Air Miner
  description: >
    Draws in and cracks the local atmosphere for oxygen, with elemental
    carbon as a byproduct feedstock for chem_plant. Self-powered.
  category: life_support
  starter_kit: true
  power_delta: -2.0
  worker_slots: 1
  default_priority: 1
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
