- id: wave_power_plant
  name: Wave Power Plant
  description: >
    Anchored buoys converting swell into power. Waves are wind-driven, so
    this needs both a coast and an atmosphere thick enough to raise a sea —
    on a thin-atmosphere world the water is nearly flat.
  category: power
  tech_prerequisite: marine_power
  power_delta: -40.0
  worker_slots: 1
  default_priority: 3
  labor_required: 1
  slot_cost: 1
  construction_turns: 4
  construction_cost:
    - id: structural_metal
      quantity: 32.0
    - id: components
      quantity: 8.0
  # Coastal only. Radius 1, not 2, on measurement: at the site a colony
  # actually lands on, ocean is within 1 hex about half the time and within 2
  # about five sixths — radius 2 would make "coastal" mean almost everywhere
  # and stop being a choice (issue #418).
  site_requirements:
    - kind: terrain
      any_of: [ocean]
      within_hexes: 1
  # No wind, no waves. Shares a property with wind_turbine deliberately —
  # both are ultimately driven by moving air — but pays for a coast to get a
  # much better curve out of it.
  # Tuned against solar_array_mk2 (30 capacity / 36 power, same tier, buildable
  # anywhere): a plant needing tier-2 tech AND a coast AND an atmosphere has to
  # beat the unconstrained option where it applies, or nothing would ever be
  # built here.
  #   thin       -> x0.62 -> 24.7 capacity / 29.0 power   (below mk2 — thin
  #                                                        seas are poor)
  #   breathable -> x0.88 -> 35.3 capacity / 41.5 power   (beats mk2)
  #   dense      -> x1.15 -> 46.0 capacity / 54.0 power   (its best case, and
  #                                                        rare — dense is ~4%
  #                                                        of foundable bodies)
  # The curve is flatter than wind_turbine's on purpose: this one is already
  # gated three ways, so it should not also swing wildly.
  output_scaling:
    property: atmosphere_density
    at_min: 0.35
    at_max: 1.15

- id: ocean_thermal_plant
  name: Ocean Thermal Plant
  description: >
    Runs a heat engine between warm surface water and the cold deep. Needs a
    coast, and needs the surface actually warmed — the further from the star,
    the smaller the temperature difference it has to work with.
  category: power
  tech_prerequisite: marine_power
  power_delta: -32.0
  worker_slots: 1
  default_priority: 3
  labor_required: 1
  slot_cost: 1
  construction_turns: 4
  construction_cost:
    - id: structural_metal
      quantity: 28.0
    - id: components
      quantity: 10.0
  site_requirements:
    - kind: terrain
      any_of: [ocean]
      within_hexes: 1
  # Scales on insolation, not atmosphere — so the two marine plants are a
  # genuine pair rather than reskins. Wave wants thick air, thermal wants a
  # near star; a coastal colony picks whichever its body favours.
  # Same reasoning as wave: it has to beat solar_array_mk2 where it applies.
  #    0.5 AU -> x1.35 -> 43.2 capacity / 51.3 power
  #    1.0 AU -> x1.12 -> 35.8 capacity / 42.6 power   (beats mk2)
  #    5.0 AU -> x0.45 -> 14.5 capacity / 17.2 power   (a cold sea is a poor
  #                                                     heat engine)
  output_scaling:
    property: insolation
    at_min: 0.05
    at_max: 1.35

- id: ocean_current_plant
  name: Ocean Current Plant
  description: >
    Submerged turbines in a standing current. Needs a coast, and needs the
    water to actually be moving — which means either a body that spins
    briskly, or one wrung by tides from the world it orbits. A tidally locked
    planet with nothing to pull on it has a dead sea.
  category: power
  tech_prerequisite: marine_power
  power_delta: -36.0
  worker_slots: 1
  default_priority: 3
  labor_required: 1
  slot_cost: 1
  construction_turns: 4
  construction_cost:
    - id: structural_metal
      quantity: 30.0
    - id: components
      quantity: 12.0
  # Coastal, same radius and same reasoning as the other two marine plants
  # (issue #418's measurement).
  site_requirements:
    - kind: terrain
      any_of: [ocean]
      within_hexes: 1
  # The third marine plant, and deliberately not a reskin of the other two
  # (issue #440). Wave scales on atmosphere_density, thermal on insolation,
  # this on ocean_circulation — spin, or tidal forcing from a parent body.
  #
  # Its character is *steady*: rotation and tides do not vary the way weather
  # and sunlight do, so this has the highest floor and the smallest swing of
  # the three. Compare the spans:
  #   wave     0.35 -> 1.15  (span 0.80)
  #   thermal  0.05 -> 1.35  (span 1.30)
  #   current  0.75 -> 1.25  (span 0.50)  <- flattest, best floor
  #
  # Tuned against solar_array_mk2 (30 capacity / 36 power, buildable
  # anywhere), the same bar the other two had to clear, using the measured
  # distribution of ocean_circulation across 300 generated systems:
  #   locked planet  v=0.01 -> x0.76 -> 27.2 capacity / 31.8 power  (below
  #                                     mk2 — a dead sea is a poor site)
  #   median planet  v=0.28 -> x0.89 -> 32.1 capacity / 37.5 power  (beats mk2)
  #   median moon    v=0.44 -> x0.97 -> 35.0 capacity / 40.8 power  (beats mk2)
  #   strong tides   v=1.00 -> x1.25 -> 45.0 capacity / 52.5 power  (its best)
  # Moons are 85.5% of foundable bodies, so the median *applicable* site is
  # the moon row — which is the one that has to clear mk2, and does.
  output_scaling:
    property: ocean_circulation
    at_min: 0.75
    at_max: 1.25

- id: solar_array_mk2
  name: Solar Array Mk2
  description: High-efficiency panel array with tracking mounts.
  category: power
  # Issue #427: mk2 used to supply the same 20 grid capacity as mk1 and
  # *less* power (20 against 24) for 2.5x the cost and an extra sol — so
  # researching improved_solar handed the player a worse solar array. It is
  # now 1.5x mk1 per slot, which is what the upgrade is for: slots are the
  # scarce resource, so a tier buys output per slot at the price of more
  # materials.
  power_delta: -30.0
  worker_slots: 0
  default_priority: 9
  labor_required: 1
  slot_cost: 1
  construction_turns: 3
  tech_prerequisite: improved_solar
  construction_cost:
    - id: structural_metal
      quantity: 30.0
    - id: components
      quantity: 5.0
  # Issue #415: the same curve as mk1 — output follows how much starlight actually reaches this body.
  #
  # The mapping is LOGARITHMIC, and that is deliberate — do not "correct" it
  # to inverse-square. The physics is already right in Star::insolation_at;
  # this is the separate question of how much it should matter to a yield.
  # Applied linearly, an 18 AU colony would get 0.3% of an inner one's solar
  # power, which does not make solar a tradeoff so much as delete it past
  # about 2 AU. The log scale keeps the ordering honest — nearer is always
  # better, by a lot — while leaving a distant colony with panels that do
  # something.
  #
  # Endpoints chosen so a body at 1 AU of a Sol-like star lands on exactly
  # nominal, preserving the ladder issue #427 tuned:
  #    0.5 AU (insolation 4.000) -> x1.23
  #    1.0 AU (insolation 1.000) -> x1.00   <- nominal, as tuned
  #    2.5 AU (insolation 0.160) -> x0.70
  #    5.0 AU (insolation 0.040) -> x0.47
  #   10.0 AU (insolation 0.010) -> x0.24
  #   18.0 AU (insolation 0.003) -> x0.12   <- the floor
  #
  # An outer-system colony is therefore poorly served by solar and should be
  # reaching for geothermal (issue #414), whose output does not depend on
  # distance from the star.
  output_scaling:
    property: insolation
    at_min: 0.12
    at_max: 1.23

