# ── Site preparation (issue #306) ────────────────────────────────────────────
#
# `grants_slot_capacity` marks a project whose product is *build-slot capacity*
# rather than a standing building: on completion it widens the colony's
# capacity and nothing is placed. It is how a colony grows past its base five
# slots — capacity is bought with construction materials, not handed out by
# difficulty preset.
#
# Every such project must be authored `slot_cost: 0`. A slot-granting project
# that consumed a slot would deadlock a full colony: the only way to make room
# would itself need room. The engine does not trust the pack on this — it
# coerces the slot cost of any slot-granting project to 0 at queue time, so a
# misauthored non-zero value here is silently ignored rather than rejected.
# `authored_site_preparation_projects_are_slot_free_and_cost_materials` in
# content/loader.rs is what actually fails if one of these grows a slot cost.
#
# `worker_slots: 0` and no recipe: the crews are notionally part of the
# construction labour the project already draws, not a standing post.
#
# Three tiers, each buying more capacity per sol of work and per tonne of
# material than the last, so expansion gets cheaper per slot as the colony's
# supply chain matures rather than scaling linearly forever.

- id: site_preparation
  name: Site Preparation
  description: >
    Grade a new pad, run a connecting tube to it, and bury the utility
    trunk — power, water, and atmosphere feeds — so a building can stand
    there at all. Adds one build slot; nothing occupies a slot itself.
  category: infrastructure
  grants_slot_capacity: 1
  slot_cost: 0
  power_delta: 0.0
  worker_slots: 0
  default_priority: 9
  labor_required: 2
  construction_turns: 4
  construction_cost:
    - id: structural_metal
      quantity: 40.0

- id: hex_remediation
  name: Hex Remediation
  description: >
    A one-shot cleanup project (issue #388) that lowers the colony's hex's
    waste contamination (issue #387) by 0.3 severity on completion, gated
    behind `bioremediation`. Costs labour and materials like any other
    construction project rather than being instant once unlocked — neglect
    that let waste overflow is a real cost, recoverable but not free.
    Contamination never decays on its own, so remediation is the only way
    down; queue it again for a hex that's still contaminated afterward.
  category: remediation
  contamination_reduction: 0.3
  slot_cost: 0
  power_delta: 0.0
  worker_slots: 0
  default_priority: 9
  labor_required: 2
  construction_turns: 3
  tech_prerequisite: bioremediation
  construction_cost:
    - id: structural_metal
      quantity: 25.0

