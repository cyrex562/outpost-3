# Building definitions for the base-colony pack (issue #166).
#
# Categories: extraction, processing, power, housing, life_support, research,
# storage, services, defense. Buildings with no `tech_prerequisite` are the
# starter set, buildable immediately at colony founding — together they form
# a closed bootstrap loop (water, food, oxygen, housing, power, research) with
# no tech required; see content/checks/bootstrap_colony/ for the balance-
# harness proof. Everything else is gated by `tech_prerequisite` and unlocked
# progressively via content/base/tech.yaml.
#
# Landing-kit redesign (playtest feedback round 2): every starter building is
# now self-powered (`power_delta <= 0`, a small net producer) so the founding
# loadout never depends on a single shared grid — losing one building to a
# hazard doesn't brown out the rest. `colony_hq` remains the consolidated
# "physical plant" option (power + water + oxygen in one slot via
# `concurrent: true` recipes, recipes.yaml, plus the research trickle from
# issue #310); the other seven are single-
# purpose landing-kit buildings players can bring individually instead of, or
# alongside, colony_hq. The pre-existing water_well / hydroponic_bay /
# smelter / research_lab / basic_habitat / solar_array_mk1 /
# life_support_module set has been moved behind Tier 1 tech (still cheap,
# still useful as a second source once researched) — see each entry's
# `tech_prerequisite` below.
#
# Buildings with no recipe are intentionally passive (pure power_delta/slot
# infrastructure) — each one below says why in its description.
#
# ── Staffing priority (issue #307) ──────────────────────────────────────────
#
# `default_priority` seeds each placed instance's staffing priority: 1 is
# staffed first, 9 last. When the colony can't fill every post, labour goes to
# the better priority and the worse one goes without — it is not spread thinly
# across everything. Players can re-rank any individual building afterwards;
# this is only where each one starts.
#
# The bands, and why they sit where they do:
#
#   1  Life support and water. Losing these kills colonists, so they are
#      staffed before anything else. Includes colony_hq (its concurrent
#      recipes ARE the starter colony's power, water, and oxygen) and
#      ice_miner (bulk water, whatever its `extraction` category says).
#   2  Food. Starvation is slower than suffocation, so just behind.
#   3  Infrastructure that needs crew to keep people alive: staffed reactors,
#      and staffed housing. Note the split — a `habitat_dome` yields 60 housing
#      only while someone is running it, so leaving it unstaffed evicts the
#      population. The passive habs at 9 have no such failure mode.
#   4  Foundational extraction — the ores and feedstock everything else is
#      built from.
#   5  Primary processing and the specialised mines feeding it. This is also
#      the engine's own default, so an unauthored building lands here.
#   6  Secondary processing, and mines for materials the colony wants rather
#      than needs.
#   7  Manufacturing and trade — valuable, but a sol's pause costs progress,
#      not lives.
#   8  Research. The classic thing to sacrifice in a crisis.
#   9  Crewless structures: passive habs, storage, passive power, sensors. All
#      have `worker_slots: 0`, so their priority is inert — authored anyway so
#      that if one ever gains a post it queues last by default rather than
#      silently landing mid-table on the engine default.
#
#      #307 suggested a hab should queue behind a lab, and that holds for these:
#      a `basic_habitat` provides its capacity with nobody working it, so it
#      genuinely never competes for labour. It does *not* hold for the staffed
#      habitats, which is why they sit at 3 instead.
#
# Ordering intent is asserted in outpost_core's
# `authored_priorities_put_life_support_ahead_of_research` test, so a careless
# retune here fails a test rather than quietly changing who starves.

# ── Starter set (no tech_prerequisite) ──────────────────────────────────────


# ── Atmospheric hazard susceptibility (issue #443) ───────────────────────────
#
# `hazard_susceptibility` scales how much of a body's atmospheric-hazard
# penalty a building actually takes — both the maintenance multiplier (#438)
# and the breakdown odds (#384). 1.0 is fully exposed, 0.0 is completely
# sealed.
#
# **Absent means 1.0.** That is deliberate: the unauthored case is the
# conservative one, so a building added later is never accidentally immune to
# a corrosive world. Only buildings whose exposure is *obvious* carry a figure
# here — sealed pressure vessels and indoor spaces. Everything outdoors and
# mechanical (turbines, solar arrays, mines, the marine plants) is left at the
# default, and the atmosphere processors below are exposed by definition since
# ingesting the air is their job.
#
# These are first-pass figures, not measured ones. Per DESIGN.md §17 the
# scalars get tuned via the balance harness rather than designed on paper; the
# point of this pass is that the *shape* is right — a sealed habitat should not
# corrode at the same rate as the rig standing beside it.

- id: colony_hq
  name: Colony HQ
  description: >
    A single prefab core facility that runs power generation, water
    extraction, and oxygen scrubbing simultaneously — the same three
    functions as solar_array_mk1 + water_well + life_support_module
    combined, in one build slot instead of three (playtest feedback:
    "multi-function starter buildings") — plus a 1 RP/sol administrative
    research trickle, the colony's only route to its first tech before a
    research_lab exists (issue #310). See recipes.yaml's hq_* recipes,
    all `concurrent: true` — they always run together, sharing this
    building's power/labor/input scale each turn (see
    outpost_core/src/colony/production.rs's module doc comment).
  category: services
  starter_kit: true
  # One headquarters per colony. It is the colony's administrative core, not a
  # generic utility block, so stacking several was always a way to exploit its
  # slot efficiency rather than a real building decision — three HQs in three
  # slots beat any honest combination of standalone structures. Need more
  # power, water, or oxygen than the one HQ supplies? Build the dedicated
  # structure for it: solar_array_mk1 and wind_turbine are both available from
  # founding with no tech, and ice_miner / air_miner cover the other two.
  max_instances: 1
  power_delta: -13.0
  worker_slots: 2
  default_priority: 1
  labor_required: 2
  slot_cost: 1
  construction_turns: 3
  construction_cost:
    - id: structural_metal
      quantity: 37.0

- id: combustion_plant
  name: Combustion Plant
  description: >
    Burns hydrocarbons pumped nearby. Alone among the early generators its
    output does not depend on where it stands at all — solar fades with
    distance from the star, wind needs air, geothermal needs shallow magma,
    and this one simply works, as long as you keep feeding it.

    That reliability is paid for every sol: it consumes hydrocarbons
    continuously and emits waste. Let the waste pile up past what the colony
    can store and it contaminates the ground the colony is standing on.
  category: power
  # No tech_prerequisite — the fourth tech-0 option (issue #417).
  power_delta: -28.0
  worker_slots: 1
  default_priority: 3
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 14.0
  # Needs fuel within reach. Deliberately a *buildability* gate rather than an
  # output scale: this generator's whole character is that its output is
  # constant, so the site decides whether you can have one at all, not how
  # well it runs. Two hexes rather than the colony's own, so a hydrocarbon
  # field beside the colony counts — matching how a well would actually be
  # sited relative to what it draws from.
  site_requirements:
    - kind: deposit
      commodity: hydrocarbons
      within_hexes: 2
  # No output_scaling on purpose. Its variability lives in the fuel supply,
  # which is already deposit-gated at the well (issue #239) — scaling here too
  # would penalise a poor site twice for the same reason.

- id: geothermal_plant
  name: Geothermal Plant
  description: >
    Taps the heat under the colony. Buildable almost anywhere and needing no
    tech, but its output is decided entirely by how shallow magma sits: on a
    hotspot it beats any other tech-0 generator, and on cold cratonic crust
    it is barely worth the slot. Check a site's geothermal reading before
    committing — the planet map shows it per hex.

    Where magma is deeper than about a fifth of the way down the scale,
    reaching it at all needs deep_drilling — the Kola Superdeep Borehole
    problem. Self-powered.
  category: power
  # No tech_prerequisite: geothermal is a tech-0 option like solar and wind
  # (issue #409). What varies is not *whether* you can build it but how much
  # it gives you, which is the point of issue #412's gradient layer.
  power_delta: -30.0
  worker_slots: 0
  default_priority: 9
  labor_required: 1
  slot_cost: 1
  construction_turns: 3
  construction_cost:
    - id: structural_metal
      quantity: 18.0
  # A *conditional* tech gate (issue #414): the site decides whether the tech
  # is needed, which `tech_prerequisite` cannot express because it would gate
  # the building everywhere at once.
  site_requirements:
    - kind: min_geothermal_gradient
      min: 0.2
      waived_by_tech: deep_drilling
  # Output rides on the gradient (issue #411 + #412). Endpoints chosen against
  # the tech-0 roster from issue #427, where solar_array_mk1 gives 20
  # capacity / 24 power per slot:
  #   gradient 0.2 (the drilling threshold) -> x0.40 ->  12 cap / 14.4 power
  #   gradient 0.5 (ordinary crust)         -> x0.78 ->  23 cap / 28.1 power
  #   gradient 0.85 (hotspot)               -> x1.21 ->  36 cap / 43.6 power
  # So it loses to solar on cold ground, edges it on average ground, and
  # clearly beats it on a hotspot — without reaching fission's 48 power/slot.
  output_scaling:
    property: geothermal_gradient
    at_min: 0.15
    at_max: 1.4

- id: ice_miner
  name: Ice Miner
  description: >
    Drills subsurface ice and melts it into potable water — the colony's
    primary bulk water source, alongside colony_hq's smaller recycling
    output. Self-powered.
  category: extraction
  starter_kit: true
  power_delta: -2.0
  worker_slots: 1
  default_priority: 1
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: excavation_rig
  name: Excavation Rig
  description: >
    Basic surface mining and excavation equipment — drills and hauls
    structural ore from local deposits. Output scales with local deposit
    richness (issue #232). Self-powered.
  category: extraction
  starter_kit: true
  power_delta: -2.0
  worker_slots: 1
  default_priority: 4
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: fabrication_complex
  name: Fabrication Complex
  description: >
    Combination foundry and machine shop, running both at once on
    independent production lines (issue #272): the foundry smelts ore into
    structural metal while the machine shop machines metal into finished
    components. An ore shortage throttles the foundry without stopping the
    machine shop. Self-powered.
  category: processing
  starter_kit: true
  power_delta: -2.0
  worker_slots: 2
  default_priority: 7
  labor_required: 2
  slot_cost: 1
  construction_turns: 3
  construction_cost:
    - id: structural_metal
      quantity: 20.0

- id: air_miner
  name: Air Miner
  description: >
    Draws in and cracks the local atmosphere for oxygen, with elemental
    carbon as a byproduct feedstock for chem_plant. Self-powered.
  category: life_support
  starter_kit: true
  power_delta: -2.0
  worker_slots: 1
  default_priority: 1
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: chem_plant
  name: Chem Plant
  description: >
    Synthesizes basic industrial chemicals from air_miner's carbon
    byproduct and water. Self-powered.
  category: processing
  starter_kit: true
  power_delta: -2.0
  worker_slots: 1
  default_priority: 5
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: greenhouse_dome
  name: Greenhouse Dome
  description: >
    Sealed growing chamber that produces food rations from water under
    artificial lighting — the landing kit's food source. Self-powered.
  category: extraction
  starter_kit: true
  power_delta: -2.0
  worker_slots: 1
  default_priority: 2
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: habitat_pod
  name: Habitat Pod
  description: >
    Pressurized bunks — the colony's first housing, available at founding
    so a landing party always has somewhere to shelter. Self-powered.
  category: housing
  starter_kit: true
  power_delta: -2.0
  worker_slots: 0
  default_priority: 9
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  # A pressure vessel with people inside; the whole design problem is keeping the outside out.
  hazard_susceptibility: 0.25
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: water_tank
  name: Water Tank
  description: >
    Banks water instead of letting it evaporate at the end of the sol —
    water's own `battery_bank` equivalent (issue #348/#380). Free and
    automatic: every colony starts with one (`starter_kit: true`,
    `slot_cost: 0`), so the founding supply package's water seed has
    somewhere to land rather than evaporating before the colony's first
    production sol. No recipe: it draws no water and produces none, it only
    lets what the colony already has carry into the next sol, up to its
    capacity.
  category: storage
  starter_kit: true
  power_delta: 0.0
  worker_slots: 0
  default_priority: 9
  labor_required: 0
  slot_cost: 0
  construction_turns: 1
  # A closed vessel with no exposed mechanism — only its shell meets the atmosphere.
  hazard_susceptibility: 0.4
  storage:
    - id: water
      quantity: 150.0

# ── Tier 1 (basic_construction / basic_power / resource_extraction) ────────
# Pre-redesign starter set — still Tier 1 (cheap, no deep prerequisites),
# now unlocked by research rather than available at founding. Useful as a
# second/backup source once you have the tech.

- id: water_well
  name: Water Well
  description: >
    Draws groundwater or subsurface ice to the surface. A second water
    source alongside colony_hq/ice_miner.
  category: extraction
  power_delta: 4.0
  worker_slots: 1
  default_priority: 1
  slot_cost: 1
  construction_turns: 2
  tech_prerequisite: resource_extraction
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: hydroponic_bay
  name: Hydroponic Bay
  description: >
    Sealed growing chamber that produces food rations from water
    under artificial lighting.
  category: extraction
  power_delta: 5.0
  worker_slots: 1
  default_priority: 2
  tech_prerequisite: basic_construction
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: smelter
  name: Smelter
  description: Converts raw metallic ore into refined plate stock.
  category: processing
  power_delta: 10.0
  worker_slots: 2
  default_priority: 5
  tech_prerequisite: resource_extraction
  construction_cost:
    - id: structural_metal
      quantity: 20.0

- id: research_lab
  name: Research Lab
  description: >
    Employs scientists to produce research output each sol,
    consuming labor and power.  Science is pooled system-wide
    and spent to unlock technologies (Phase 4b).
  category: research
  power_delta: 8.0
  worker_slots: 3
  default_priority: 8
  slot_cost: 1
  construction_turns: 4
  # Indoor work; the delicate equipment never meets outside air.
  hazard_susceptibility: 0.3
  tech_prerequisite: basic_construction
  construction_cost:
    - id: structural_metal
      quantity: 30.0

- id: basic_habitat
  name: Basic Habitat
  description: >
    Minimal pressurized bunks — a second housing source alongside
    habitat_pod.
  category: housing
  power_delta: 1.0
  worker_slots: 0
  default_priority: 9
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  # Same sealed-envelope reasoning as habitat_pod.
  hazard_susceptibility: 0.25
  tech_prerequisite: basic_construction
  construction_cost:
    - id: structural_metal
      quantity: 15.0

- id: solar_array_mk1
  name: Solar Array Mk1
  description: Basic photovoltaic panel array. A dedicated power source.
  category: power
  # No tech_prerequisite: a colony must be able to build power on sol 1.
  # Before this, every no-tech building was either self-covering
  # (`power_delta: -2`) or a consumer, so the only real generator at tech 0
  # was colony_hq — capped at one instance (issue #407), which left a colony
  # that outgrew it with no route to more power until basic_power.
  power_delta: -20.0
  worker_slots: 0
  default_priority: 9
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 12.0
  # Issue #415: output follows how much starlight actually reaches this body.
  #
  # The mapping is LOGARITHMIC, and that is deliberate — do not "correct" it
  # to inverse-square. The physics is already right in Star::insolation_at;
  # this is the separate question of how much it should matter to a yield.
  # Applied linearly, an 18 AU colony would get 0.3% of an inner one's solar
  # power, which does not make solar a tradeoff so much as delete it past
  # about 2 AU. The log scale keeps the ordering honest — nearer is always
  # better, by a lot — while leaving a distant colony with panels that do
  # something.
  #
  # Endpoints chosen so a body at 1 AU of a Sol-like star lands on exactly
  # nominal, preserving the ladder issue #427 tuned:
  #    0.5 AU (insolation 4.000) -> x1.23
  #    1.0 AU (insolation 1.000) -> x1.00   <- nominal, as tuned
  #    2.5 AU (insolation 0.160) -> x0.70
  #    5.0 AU (insolation 0.040) -> x0.47
  #   10.0 AU (insolation 0.010) -> x0.24
  #   18.0 AU (insolation 0.003) -> x0.12   <- the floor
  #
  # An outer-system colony is therefore poorly served by solar and should be
  # reaching for geothermal (issue #414), whose output does not depend on
  # distance from the star.
  output_scaling:
    property: insolation
    at_min: 0.12
    at_max: 1.23

- id: life_support_module
  name: Life Support Module
  description: >
    Compact atmosphere scrubber/generator — cheap, low-output baseline
    oxygen supply. See atmospheric_harvester for a higher-throughput
    upgrade.
  category: life_support
  power_delta: 3.0
  worker_slots: 1
  default_priority: 1
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  tech_prerequisite: basic_power
  construction_cost:
    - id: structural_metal
      quantity: 15.0

- id: structural_mine
  name: Structural Mine
  description: >
    Open-pit extraction of surface iron deposits. Yields waste rock
    alongside ore — bulky but sellable, not just discarded tailings.
  category: extraction
  power_delta: 6.0
  worker_slots: 2
  default_priority: 4
  labor_required: 1
  slot_cost: 1
  construction_turns: 3
  tech_prerequisite: resource_extraction
  construction_cost:
    - id: structural_metal
      quantity: 15.0

- id: wind_turbine
  name: Wind Turbine
  description: Mechanical turbine harvesting atmospheric wind energy.
  category: power
  # No tech_prerequisite — see solar_array_mk1.
  #
  # Issue #416 gives wind the niche #409 promised it: it needs an atmosphere
  # to turn in, and it gets stronger as that atmosphere thickens. Solar and
  # wind are no longer two identically-shaped buildings where one simply wins
  # — solar fades with distance from the star (issue #415), wind does not
  # care about distance at all but is unavailable on the two thirds of
  # foundable bodies that are airless.
  power_delta: -18.0
  worker_slots: 0
  default_priority: 9
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 10.0
  # Unbuildable without an atmosphere: a turbine on an airless moon is
  # nonsense, and roughly two thirds of foundable bodies are vacuum, so this
  # is a real constraint rather than a formality.
  site_requirements:
    - kind: min_atmosphere
      density: thin
  # Output rides on how thick that atmosphere is (issue #411). Thin is the
  # most common atmosphere among foundable bodies (~22%), so it is the case
  # worth tuning around — poor but genuinely usable, not a token:
  #   thin       -> x0.60 -> 10.8 capacity / 12.6 power
  #   breathable -> x1.05 -> 18.9 capacity / 22.1 power
  #   dense      -> x1.50 -> 27.0 capacity / 31.5 power
  # Against solar's 20/24 at 1 AU: wind loses on a thin atmosphere near the
  # star, matches on a breathable one, and wins outright on a dense one or
  # anywhere far enough out that sunlight has faded.
  output_scaling:
    property: atmosphere_density
    at_min: 0.15
    at_max: 1.5

- id: conductive_mine
  name: Conductive Mine
  description: >
    Open-pit extraction of copper/aluminum-family deposits — feedstock for
    power and electronics manufacturing (issue #207).
  category: extraction
  power_delta: 6.0
  worker_slots: 2
  default_priority: 5
  labor_required: 1
  slot_cost: 1
  construction_turns: 3
  tech_prerequisite: resource_extraction
  construction_cost:
    - id: structural_metal
      quantity: 15.0

- id: warehouse
  name: Warehouse
  description: >
    Bulk storage bay. No active recipe — it is passive infrastructure
    reserved as a future hook for pool-capacity bonuses.
  category: storage
  power_delta: 0.0
  worker_slots: 0
  default_priority: 9
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  # Enclosed storage — a shell, with nothing mechanical exposed.
  hazard_susceptibility: 0.4
  tech_prerequisite: basic_construction
  construction_cost:
    - id: structural_metal
      quantity: 15.0

- id: battery_bank
  name: Battery Bank
  description: >
    Banks surplus power instead of letting it evaporate at the end of the
    sol (issue #348's storage-is-a-building-not-a-property-of-the-substance
    model — the worked example for the mechanism). No recipe: it draws no
    power and produces none, it only lets what the colony already generates
    carry into the next sol, up to its capacity. Surplus beyond that still
    evaporates exactly as it did before this building existed.
  category: storage
  power_delta: 0.0
  worker_slots: 0
  default_priority: 9
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  # Sealed cells; no moving parts outside to be attacked.
  hazard_susceptibility: 0.4
  tech_prerequisite: basic_construction
  construction_cost:
    - id: structural_metal
      quantity: 20.0
  storage:
    - id: power
      quantity: 40.0

- id: water_bottling_plant
  name: Water Bottling Plant
  description: >
    Crates banked water into shippable `water_container` cargo, or unpacks
    containers back into usable water — a switchable pair of recipes
    (`bottle_water`/`unbottle_water`, recipes.yaml), not both at once. This
    is water's crating route (issue #348/#380): utilities move between
    colonies only once converted into a real commodity a convoy can carry,
    the same way power would need crating into charged cells.
  category: processing
  power_delta: 3.0
  worker_slots: 1
  default_priority: 6
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  tech_prerequisite: basic_construction
  construction_cost:
    - id: structural_metal
      quantity: 18.0

- id: waste_compactor
  name: Waste Compactor
  description: >
    Crates banked waste into shippable `waste_container` cargo, or unpacks
    containers back into usable (bunker-storable) waste — a switchable pair
    of recipes (`crate_waste`/`uncrate_waste`, recipes.yaml), not both at
    once. This is waste's crating route (issue #348/#389): a colony with
    spare `waste_processing` capacity can genuinely absorb another colony's
    surplus by convoy, per #381's own taxonomy, the same way water needed
    crating into `water_container` to travel.
  category: processing
  power_delta: 3.0
  worker_slots: 1
  default_priority: 6
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  tech_prerequisite: basic_construction
  construction_cost:
    - id: structural_metal
      quantity: 18.0

- id: recycling_plant
  name: Recycling Plant
  description: >
    Provides standing waste-processing capacity (issue #381's `process_waste`
    recipe) — the same authoring shape as a habitat's housing capacity, not
    a stock that's drawn down. Does not yet gate anything on its own; a
    colony producing more waste than this capacity plus its `waste_bunker`
    storage will contaminate its own hex once #387 wires that consequence up.
  category: processing
  power_delta: 5.0
  worker_slots: 1
  default_priority: 6
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  tech_prerequisite: basic_construction
  construction_cost:
    - id: structural_metal
      quantity: 20.0

- id: waste_bunker
  name: Waste Bunker
  description: >
    Banks surplus waste instead of letting it evaporate at the end of the
    sol — waste's own `battery_bank`/`water_tank` equivalent (issue #381).
    No recipe: it draws no waste and produces none, it only lets what the
    colony already generates carry into the next sol, up to its capacity.
  category: storage
  power_delta: 0.0
  worker_slots: 0
  default_priority: 9
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
