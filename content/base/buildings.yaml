# Building definitions for the base-colony pack (issue #166).
#
# Categories: extraction, processing, power, housing, life_support, research,
# storage, services, defense. Buildings with no `tech_prerequisite` are the
# starter set, buildable immediately at colony founding — together they form
# a closed bootstrap loop (water, food, oxygen, housing, power, research) with
# no tech required; see content/checks/bootstrap_colony/ for the balance-
# harness proof. Everything else is gated by `tech_prerequisite` and unlocked
# progressively via content/base/tech.yaml.
#
# Landing-kit redesign (playtest feedback round 2): every starter building is
# now self-powered (`power_delta <= 0`, a small net producer) so the founding
# loadout never depends on a single shared grid — losing one building to a
# hazard doesn't brown out the rest. `colony_hq` remains the consolidated
# "physical plant" option (power + water + oxygen in one slot via
# `concurrent: true` recipes, recipes.yaml, plus the research trickle from
# issue #310); the other seven are single-
# purpose landing-kit buildings players can bring individually instead of, or
# alongside, colony_hq. The pre-existing water_well / hydroponic_bay /
# smelter / research_lab / basic_habitat / solar_array_mk1 /
# life_support_module set has been moved behind Tier 1 tech (still cheap,
# still useful as a second source once researched) — see each entry's
# `tech_prerequisite` below.
#
# Buildings with no recipe are intentionally passive (pure power_delta/slot
# infrastructure) — each one below says why in its description.
#
# ── Staffing priority (issue #307) ──────────────────────────────────────────
#
# `default_priority` seeds each placed instance's staffing priority: 1 is
# staffed first, 9 last. When the colony can't fill every post, labour goes to
# the better priority and the worse one goes without — it is not spread thinly
# across everything. Players can re-rank any individual building afterwards;
# this is only where each one starts.
#
# The bands, and why they sit where they do:
#
#   1  Life support and water. Losing these kills colonists, so they are
#      staffed before anything else. Includes colony_hq (its concurrent
#      recipes ARE the starter colony's power, water, and oxygen) and
#      ice_miner (bulk water, whatever its `extraction` category says).
#   2  Food. Starvation is slower than suffocation, so just behind.
#   3  Infrastructure that needs crew to keep people alive: staffed reactors,
#      and staffed housing. Note the split — a `habitat_dome` yields 60 housing
#      only while someone is running it, so leaving it unstaffed evicts the
#      population. The passive habs at 9 have no such failure mode.
#   4  Foundational extraction — the ores and feedstock everything else is
#      built from.
#   5  Primary processing and the specialised mines feeding it. This is also
#      the engine's own default, so an unauthored building lands here.
#   6  Secondary processing, and mines for materials the colony wants rather
#      than needs.
#   7  Manufacturing and trade — valuable, but a sol's pause costs progress,
#      not lives.
#   8  Research. The classic thing to sacrifice in a crisis.
#   9  Crewless structures: passive habs, storage, passive power, sensors. All
#      have `worker_slots: 0`, so their priority is inert — authored anyway so
#      that if one ever gains a post it queues last by default rather than
#      silently landing mid-table on the engine default.
#
#      #307 suggested a hab should queue behind a lab, and that holds for these:
#      a `basic_habitat` provides its capacity with nobody working it, so it
#      genuinely never competes for labour. It does *not* hold for the staffed
#      habitats, which is why they sit at 3 instead.
#
# Ordering intent is asserted in outpost_core's
# `authored_priorities_put_life_support_ahead_of_research` test, so a careless
# retune here fails a test rather than quietly changing who starves.

# ── Starter set (no tech_prerequisite) ──────────────────────────────────────

- id: colony_hq
  name: Colony HQ
  description: >
    A single prefab core facility that runs power generation, water
    extraction, and oxygen scrubbing simultaneously — the same three
    functions as solar_array_mk1 + water_well + life_support_module
    combined, in one build slot instead of three (playtest feedback:
    "multi-function starter buildings") — plus a 1 RP/sol administrative
    research trickle, the colony's only route to its first tech before a
    research_lab exists (issue #310). See recipes.yaml's hq_* recipes,
    all `concurrent: true` — they always run together, sharing this
    building's power/labor/input scale each turn (see
    outpost_core/src/colony/production.rs's module doc comment).
  category: services
  starter_kit: true
  # One headquarters per colony. It is the colony's administrative core, not a
  # generic utility block, so stacking several was always a way to exploit its
  # slot efficiency rather than a real building decision — three HQs in three
  # slots beat any honest combination of standalone structures. Need more
  # power, water, or oxygen than the one HQ supplies? Build the dedicated
  # structure for it: solar_array_mk1 and wind_turbine are both available from
  # founding with no tech, and ice_miner / air_miner cover the other two.
  max_instances: 1
  power_delta: -13.0
  worker_slots: 2
  default_priority: 1
  labor_required: 2
  slot_cost: 1
  construction_turns: 3
  construction_cost:
    - id: structural_metal
      quantity: 37.0

- id: ice_miner
  name: Ice Miner
  description: >
    Drills subsurface ice and melts it into potable water — the colony's
    primary bulk water source, alongside colony_hq's smaller recycling
    output. Self-powered.
  category: extraction
  starter_kit: true
  power_delta: -2.0
  worker_slots: 1
  default_priority: 1
  labor_required: 1
  slot_cost: 1
  construction_turns: 2
  construction_cost:
    - id: structural_metal
      quantity: 10.0

- id: excavation_rig
  name: Excavation Rig
  description: >
    Basic surface mining and excavation equipment — drills and hauls
    structural ore from local deposits. Output scales with local deposit
