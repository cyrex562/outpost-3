# Outpost 3 — Environmental Hazard Configuration
# Loaded at runtime. Probabilities are per colony-sol; severity in [0, 1].
#
# ── Modifiers (issue #448) ───────────────────────────────────────────────────
#
# Each modifier names ONE world property and a probability multiplier:
#
#   - { terrain: volcanic, x: 3.0 }     the colony hex's terrain
#   - { biome:   desert,   x: 2.5 }     the colony hex's biome
#   - { atmosphere: thin,  x: 1.5 }     the body's atmospheric density
#   - { radiation:  high,  x: 3.0 }     the body's ambient radiation
#
# **Every matching modifier multiplies.** A volcanic-terrain, barren-biome site
# takes both of seismic_event's first two, for 4.5x. Each property is an
# independent statement about the place, which is how output_scaling, the
# difficulty scalars and hazard susceptibility already compose. The product is
# clamped to a probability, so stacking cannot exceed certainty.
#
# A slug the engine does not recognise is a **load error**, not a warning. This
# table previously keyed off a `terrain_modifiers` map whose eleven slugs
# included six — arid, rocky, exposed, humid, tropical, irradiated — that named
# nothing in any engine enum, plus three that were biomes filed under terrain.
# They silently did nothing for the life of the project. Failing loudly is what
# stops that recurring.
#
# Valid values:
#   terrain:    plains | hills | mountains | wetlands | ocean | volcanic
#   biome:      desert | tundra | polar | forest | jungle | grassland
#               | barren | ocean | geothermal
#   atmosphere: vacuum | thin | breathable | dense
#   radiation:  low | moderate | high

kinds:
  - kind: dust_storm
    base_probability: 0.02
    severity_min: 0.1
    severity_max: 0.7
    stability_damage_per_severity: 0.25
    commodity_loss_per_severity: 0.08
    population_damage_per_severity: 0.005
    modifiers:
      # Loose dry surface to lift. `arid` was a near-synonym of `desert` under
      # the old single-key lookup, so only ever one of the two could apply;
      # `barren` carries that intent onto a slug that exists.
      - { biome: desert, x: 2.5 }
      - { biome: barren, x: 1.8 }
      # Frozen ground holds its dust down.
      - { biome: tundra, x: 0.4 }
      # Thin air cannot raise much of a storm; a dense one carries more.
      - { atmosphere: thin, x: 0.5 }
      - { atmosphere: dense, x: 1.3 }

  - kind: seismic_event
    base_probability: 0.005
    severity_min: 0.2
    severity_max: 0.9
    stability_damage_per_severity: 0.40
    commodity_loss_per_severity: 0.12
    population_damage_per_severity: 0.015
    modifiers:
      - { terrain: volcanic, x: 3.0 }
      # Was `rocky` — bare rock, which is what `barren` means here.
      - { biome: barren, x: 1.5 }
      - { biome: geothermal, x: 2.0 }
      # Settled flat ground is the stable case.
      - { terrain: plains, x: 0.6 }
      - { terrain: mountains, x: 1.4 }

  - kind: meteor_impact
    base_probability: 0.001
    severity_min: 0.5
    severity_max: 1.0
    stability_damage_per_severity: 0.60
    commodity_loss_per_severity: 0.20
    population_damage_per_severity: 0.040
    modifiers:
      # Was `exposed`. What it meant is that nothing burns up on the way in:
      # no atmosphere at all is worst, a thin one barely better, a dense one
      # is real protection.
      - { atmosphere: vacuum, x: 2.0 }
      - { atmosphere: thin, x: 1.5 }
      - { atmosphere: dense, x: 0.5 }

  - kind: equipment_failure
    base_probability: 0.015
    severity_min: 0.1
    severity_max: 0.6
    stability_damage_per_severity: 0.15
    commodity_loss_per_severity: 0.05
    population_damage_per_severity: 0.002
    modifiers: []

  - kind: disease_outbreak
    base_probability: 0.008
    severity_min: 0.1
    severity_max: 0.8
    stability_damage_per_severity: 0.30
    commodity_loss_per_severity: 0.04
    population_damage_per_severity: 0.025
    modifiers:
      # Was `humid` and `tropical` — two names for the same warm wet place,
      # only one of which could ever have applied. `jungle` is that place;
      # `wetlands` is the terrain-scale version of it.
      - { biome: jungle, x: 2.0 }
      - { terrain: wetlands, x: 1.8 }
      # Cold and dry suppresses transmission.
      - { biome: polar, x: 0.5 }

  - kind: radiation_leak
    base_probability: 0.003
    severity_min: 0.2
    severity_max: 0.7
    stability_damage_per_severity: 0.35
    commodity_loss_per_severity: 0.06
    population_damage_per_severity: 0.030
    modifiers:
      # Was `irradiated`, which named nothing. Ambient radiation is a real body
      # attribute and is plainly what was meant.
      - { radiation: high, x: 3.0 }
      - { radiation: moderate, x: 1.6 }
      # Was `polar`. Thin air means less shielding from what arrives.
      - { atmosphere: vacuum, x: 1.6 }
      - { atmosphere: thin, x: 1.4 }
