- id: sensor_systems
  name: Sensor Systems
  description: >
    Long-baseline sensor arrays and signal-processing pipelines — improves
    survey-expedition full/partial reveal odds (#235) in addition to
    unlocking the sensor_array building.
  category: astronautics
  tier: 3
  research_cost: 1300.0
  prerequisites:
    - automation
  unlocks:
    buildings:
      - sensor_array
  effects:
    - type: survey_modifier_bonus
      full_reveal_bonus: 0.05
      partial_reveal_bonus: 0.05

- id: propulsion_engineering
  name: Propulsion Engineering
  description: Higher-thrust, higher-efficiency drive systems for interplanetary transit.
