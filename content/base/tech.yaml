# Technology Tree for Outpost 3 (issue #236)
#
# Expanded from the original 12-entry placeholder set (see git history) into
# a genuine multi-branch DAG across six categories. Design discipline (see
# docs/DESIGN.md §7A):
#   - unlocks-first: most techs gate a building/commodity/capability/survey
#     effect into availability; flat numeric `Bonus` effects are a deliberate
#     minority.
#   - additive-within-category bonus stacking, not multiplicative.
#   - a web/DAG, not permanent mutually-exclusive branches — every tech is
#     eventually reachable from the tier-1 starter set.
#
# Categories: engineering, physical_sciences, life_sciences, computing,
# materials_science, astronautics. The last two are new in #236:
# materials_science unifies the refining/fabrication chains that used to be
# bundled two-deep under advanced_materials/automation; astronautics gives
# the #235 survey-expedition system (propulsion, sensors) and the #234
# orbital system real tech hooks.
#
# This is issue #236's "solid start" — not the full SMAC/Stellaris-scale
# tree yet. Follow-up issues (filed alongside this PR) track further waves:
# deeper per-category branches, endgame/ascension-tier content, and wiring
# tech-gate *enforcement* at the command layer (currently, like the
# pre-#236 tree, `TechEffect`/`unlocks` populate tracking state that isn't
# yet read back by `Command::QueueConstruction` or the orbital/outpost/
# expedition commands — a pre-existing gap this issue doesn't newly
# introduce, just doesn't fix either; see the filed follow-up).

# ─── Tier 1: starter techs (no prerequisites) ───────────────────────────────

- id: basic_construction
  name: Basic Construction
  description: Foundational construction techniques for simple buildings and infrastructure.
  category: engineering
  tier: 1
  research_cost: 100.0
  prerequisites: []
  unlocks:
    buildings:
      - warehouse
    bonuses:
      - construction_speed_10_percent

- id: basic_power
  name: Basic Power Systems
  description: Solar panel technology for sustainable energy generation.
  category: engineering
  tier: 1
  research_cost: 150.0
  prerequisites: []
  unlocks:
    buildings:
      - wind_turbine
    bonuses: []

- id: resource_extraction
  name: Resource Extraction
  description: Automated mining and extraction techniques for raw materials.
  category: engineering
  tier: 1
  research_cost: 200.0
  prerequisites: []
  unlocks:
    buildings:
      - structural_mine
      - conductive_mine
      - hydrocarbon_well
      - gas_extractor
      - fissile_mine
      - semiconductor_mine
      - silicate_quarry
    bonuses:
      - mining_efficiency_10_percent

# ─── Tier 2 ──────────────────────────────────────────────────────────────────

- id: improved_solar
  name: Improved Solar Arrays
  description: Higher-efficiency photovoltaic cells and energy storage.
  category: engineering
  tier: 2
  research_cost: 600.0
  prerequisites:
    - basic_power
  unlocks:
    buildings:
      - solar_array_mk2
      - fission_reactor
    bonuses:
      - power_generation_20_percent

- id: hydroponics
  name: Hydroponic Agriculture
  description: Soil-free farming techniques optimized for enclosed environments.
  category: life_sciences
  tier: 2
  research_cost: 400.0
  prerequisites:
    - basic_construction
  unlocks:
    buildings:
      - water_treatment_plant
      - food_processing_plant
    bonuses:
      - food_production_15_percent

- id: advanced_materials
  name: Advanced Materials Processing
  description: >
    Foundational metallurgy underpinning every deeper refining branch
    (materials_science). Trimmed in #236 to its own real unlock
    (structural_metal availability) — the buildings it used to bundle
    (apartment_block, refinery, precious_mine/refinery, petrochemical_plant,
    nuclear_refinery) now have their own dedicated techs below, so the tree
    branches here instead of gating six buildings behind one node.
  category: physical_sciences
  tier: 2
  research_cost: 500.0
  prerequisites:
    - resource_extraction
  unlocks:
    resources:
      - structural_metal
    bonuses: []

- id: logistics_network
  name: Logistics Networks
  description: Inter-colony scheduling and cargo-routing systems.
  category: engineering
  tier: 2
  research_cost: 450.0
  prerequisites:
    - basic_construction
    - resource_extraction
  unlocks:
    buildings:
      - trade_depot

- id: urban_habitation
  name: Urban Habitation
  description: Dense, multi-story colonist housing.
  category: engineering
  tier: 2
  research_cost: 400.0
  prerequisites:
    - advanced_materials
  unlocks:
    buildings:
      - apartment_block

- id: fuel_refining
  name: Fuel Refining
  description: Cracking and distillation processes for structural and chemical feedstocks.
  category: materials_science
  tier: 2
  research_cost: 400.0
  prerequisites:
    - advanced_materials
  unlocks:
    buildings:
      - refinery

- id: precious_metallurgy
  name: Precious Metallurgy
  description: Extraction and refining of low-abundance high-value ores.
  category: materials_science
  tier: 2
  research_cost: 450.0
  prerequisites:
    - advanced_materials
  unlocks:
    buildings:
      - precious_mine
      - precious_refinery

- id: petrochemical_processing
  name: Petrochemical Processing
  description: Hydrocarbon cracking into plastics and chemical feedstocks.
  category: materials_science
  tier: 2
  research_cost: 450.0
  prerequisites:
    - advanced_materials
  unlocks:
    buildings:
      - petrochemical_plant

- id: orbital_mechanics
  name: Orbital Mechanics
  description: >
    Trajectory-planning fundamentals for interplanetary transit — the entry
    point of the astronautics branch feeding #235's survey expeditions.
  category: astronautics
  tier: 2
  research_cost: 350.0
  prerequisites:
    - basic_power
  effects:
    - type: reduce_transit_time
      fraction: 0.10

# ─── Tier 3 ──────────────────────────────────────────────────────────────────

- id: automation
  name: Industrial Automation
  description: >
    Robotic systems and AI-controlled processes to reduce labor
    requirements. Trimmed in #236: the ten buildings this used to bundle at
    once now split across automation itself (fabricator, manufactory) and
    five dedicated tier-3/4 techs below (refractory_metallurgy,
    advanced_ceramics, semiconductor_fabrication, theoretical_physics,
    sensor_systems), each a real branch point instead of a single node
    unlocking a third of the building roster.
  category: computing
  tier: 3
  research_cost: 1000.0
  prerequisites:
    - advanced_materials
  unlocks:
    buildings:
      - fabricator
      - manufactory
    bonuses:
      - production_efficiency_25_percent
      - labor_requirement_minus_20_percent

- id: fusion_basics
  name: Fusion Fundamentals
  description: >
    Theoretical foundation for fusion power generation. Pure theory tech —
    the actual reactor building is gated behind fusion_engineering, which
    also needs automation's industrial base (a theory-then-engineering
    split, matching the SMAC/Stellaris convention of separating fundamental
    research from the applied tech that turns it into a building).
  category: physical_sciences
  tier: 3
  research_cost: 1600.0
  prerequisites:
    - improved_solar
    - advanced_materials

- id: genetic_engineering
  name: Genetic Engineering
  description: Manipulation of plant and animal genomes for improved yields and traits.
  category: life_sciences
  tier: 3
  research_cost: 1500.0
  prerequisites:
    - hydroponics
  unlocks:
    bonuses:
      - food_production_50_percent
      - colonist_health_bonus_15_percent
    events:
      - genetic_breakthrough

- id: planetary_life_support
  name: Planetary Life Support Engineering
  description: >
    Closed-loop atmosphere processing, radiation shielding, and thermal
    regulation systems robust enough to found colonies on worlds that would
    otherwise be uninhabitable (issue #183).
  category: life_sciences
  tier: 3
  research_cost: 1800.0
  prerequisites:
    - hydroponics
    - advanced_materials
  effects:
    - type: unlock_capability
      capability_id: colonize_harsh_worlds
  unlocks:
    buildings:
      - habitat_dome
      - atmospheric_harvester

- id: radiation_shielding
  name: Radiation Shielding
  description: >
    Hardened habitat plating and shielded life-support conduits that cancel
    a linked colony's radiation penalty on its habitability score, regardless
    of the home body's actual radiation level. Applies retroactively to
    every colony already linked to a body when researched (issue #185).
  category: life_sciences
  tier: 3
  research_cost: 1200.0
  prerequisites:
    - advanced_materials
  effects:
    - type: mitigate_attribute
      attribute: radiation

- id: nuclear_fuel_cycle
  name: Nuclear Fuel Cycle
  description: Fissile-ore enrichment and reprocessing.
  category: materials_science
  tier: 3
  research_cost: 1100.0
  prerequisites:
    - advanced_materials
    - resource_extraction
  unlocks:
    buildings:
      - nuclear_refinery

- id: refractory_metallurgy
  name: Refractory Metallurgy
  description: High-temperature alloy processing for heat-tolerant components.
  category: materials_science
  tier: 3
  research_cost: 1000.0
