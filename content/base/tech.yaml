- id: structural_composites
  name: Structural Composites
  description: Layered fiber-reinforced panels that speed up general construction.
  category: engineering
  tier: 3
  research_cost: 900.0
  prerequisites:
    - advanced_materials
  effects:
    - type: bonus
      category: construction_speed
      value: 0.15
    # Panels arrive as prefabricated utility spines rather than being built
    # up on site, so a site-prep pad needs less metal and less time (#306).
    - type: reduce_infrastructure_project
      cost_fraction: 0.15
      time_fraction: 0.10

- id: modular_site_works
  name: Modular Site Works
  description: >
    Standardised pad templates and automated grading plant. Site preparation
