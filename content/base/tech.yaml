    multiplicatively with structural_composites rather than adding to it, so
    expansion approaches a floor instead of reaching zero.
  category: engineering
  tier: 3
  research_cost: 850.0
  prerequisites:
    - basic_construction
  effects:
    - type: reduce_infrastructure_project
      cost_fraction: 0.25
      time_fraction: 0.25

