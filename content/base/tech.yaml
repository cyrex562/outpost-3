# ─── Wave 2 (issue #249) ─────────────────────────────────────────────────────
#
# #236 shipped a "solid start" (~48 entries) and explicitly deferred further
# scale to a follow-up. This wave deepens every existing tier-3/4/5 category
# with real branch points (not just capstone padding) and adds a new tier 7
# of ascension/secret-project-style capstones, converging pairs of tier-6
# techs — often across two different categories — into forward-looking
# `unlock_capability` gates, matching the megastructure_engineering/
# terraforming_theory precedent from #236. Sized against SMAC's ~90-tech
# reference point (docs/DESIGN.md §7A), not an arbitrary round number.

