    Robotic systems and AI-controlled processes to reduce labor
    requirements. Trimmed in #236: the ten buildings this used to bundle at
    once now split across automation itself (fabricator, manufactory) and
    five dedicated tier-3/4 techs below (refractory_metallurgy,
    advanced_ceramics, semiconductor_fabrication, theoretical_physics,
    sensor_systems), each a real branch point instead of a single node
    unlocking a third of the building roster.
  category: computing
  tier: 3
  research_cost: 1000.0
  prerequisites:
    - advanced_materials
  unlocks:
    buildings:
      - fabricator
      - manufactory
    bonuses:
      - production_efficiency_25_percent
      - labor_requirement_minus_20_percent

- id: fusion_basics
  name: Fusion Fundamentals
  description: >
    Theoretical foundation for fusion power generation. Pure theory tech —
    the actual reactor building is gated behind fusion_engineering, which
    also needs automation's industrial base (a theory-then-engineering
    split, matching the SMAC/Stellaris convention of separating fundamental
    research from the applied tech that turns it into a building).
  category: physical_sciences
  tier: 3
  research_cost: 1600.0
  prerequisites:
    - improved_solar
    - advanced_materials

- id: genetic_engineering
  name: Genetic Engineering
  description: Manipulation of plant and animal genomes for improved yields and traits.
