# Recipes used in the gas-resources balance check — rates mirror
# content/base/recipes.yaml exactly.
- id: extract_fusion_fuel
  name: Extract Fusion Fuel
  building: gas_extractor
  cycle_sols: 1
  inputs: []
  outputs:
    - id: fusion_fuel
      quantity: 4.0

- id: extract_noble_gases
  name: Extract Noble Gases
  building: gas_extractor
  cycle_sols: 1
  inputs: []
  outputs:
    - id: noble_gases
      quantity: 6.0

- id: generate_power_fusion
  name: Generate Power (Fusion)
  building: fusion_reactor_prototype
  cycle_sols: 1
  inputs:
    - id: fusion_fuel
      quantity: 3.0
  outputs:
    - id: power
      quantity: 60.0
