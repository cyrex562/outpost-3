id: carbon-semiconductor-check
name: Carbon & Semiconductor Balance Check
version: '0.1.0'
description: >
  Proves the fifth raw-material family added in issue #216
  (carbon -> carbon_composites, semiconductor_ore -> semiconductors)
  closes end-to-end: one atmospheric_harvester (carbon byproduct) and
  one semiconductor_mine feed one refractory_foundry (carbon_composites
  recipe) and one semiconductor_fab. No imports — everything produced
  on-site, mirroring content/checks/metal_categories's self-contained
  style since these are this issue's new raw materials.
