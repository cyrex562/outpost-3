# Recipes used in the metal-categories balance check — rates mirror
# content/base/recipes.yaml exactly.
- id: mine_conductive_ore
  name: Mine Conductive Ore
  building: conductive_mine
  cycle_sols: 1
  inputs: []
  outputs:
    - id: conductive_ore
      quantity: 8.0

- id: smelt_conductive_ore
  name: Smelt Conductive Ore
  building: refinery
  cycle_sols: 1
  inputs:
    - id: conductive_ore
      quantity: 4.0
  outputs:
    - id: conductive_metal
      quantity: 3.0

- id: mine_precious_ore
  name: Mine Precious Ore
  building: precious_mine
  cycle_sols: 1
  inputs: []
  outputs:
    - id: precious_ore
      quantity: 3.0

- id: refine_precious_ore
  name: Refine Precious Ore
  building: precious_refinery
  cycle_sols: 2
  inputs:
    - id: precious_ore
      quantity: 3.0
  outputs:
    - id: precious_metal
      quantity: 2.0

- id: mine_refractory_ore
  name: Mine Refractory Ore
  building: refractory_mine
  cycle_sols: 1
  inputs: []
  outputs:
    - id: refractory_ore
      quantity: 4.0

- id: refine_refractory_ore
  name: Refine Refractory Ore
  building: refractory_foundry
  cycle_sols: 2
  inputs:
    - id: refractory_ore
      quantity: 4.0
  outputs:
    - id: refractory_metal
      quantity: 2.0
