# Assertions for the end-item-tier balance check.
#
# Expected net rates (production - consumption), all per-sol:
#   mechanical_components: 4.0 imported − 3.0 consumer_goods              = +1.0/sol
#   electronic_components: 2.0 imported − (1.0 consumer_goods + 0.333 luxury) = +0.667/sol
#   precious_metal:        1.0 imported − 0.667 luxury                    = +0.333/sol
#   consumer_goods:        2.0 produced (2/1 sol)                         = +2.0/sol
#   luxury_goods:           0.333 produced (1/3 sols)                     = +0.333/sol
#
# No overall-verdict assertion: every net is comfortably positive by design
# (BalanceVerdict::Trivial, not Closed) — see content/checks/bootstrap_colony/
# for why that's expected and not a bug.

- commodity: mechanical_components
  expect: closed
  min_net: 0.5
  label: mechanical-components-not-in-deficit

- commodity: electronic_components
  expect: closed
  min_net: 0.25
  label: electronic-components-not-in-deficit

- commodity: precious_metal
  expect: closed
  min_net: 0.1
  label: precious-metal-not-in-deficit

- commodity: consumer_goods
  expect: closed
  min_net: 1.0
  label: consumer-goods-surplus

- commodity: luxury_goods
  expect: closed
  min_net: 0.1
  label: luxury-goods-surplus
