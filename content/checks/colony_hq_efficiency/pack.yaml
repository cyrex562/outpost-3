id: colony-hq-efficiency-check
name: Colony HQ Consolidated-Building Sustainability Check
version: '0.1.0'
description: >
  Proves colony_hq — the consolidated multi-function starter building
  (playtest feedback: "multi-function starter buildings") — closes
  water/oxygen/power for a 100-colonist population using exactly ONE build
  slot, matching the combined output of building solar_array_mk1 +
  water_well + life_support_module standalone (3 slots) in
  content/checks/bootstrap_colony/. Population per-capita consumption is
  modeled as the same synthetic sink pattern bootstrap_colony uses (minus
  food_ration, since colony_hq doesn't produce food — see hydroponic_bay
  for that function, unaffected by this consolidation).

  It also pins colony_hq's 1 RP/sol administrative research trickle (issue
  #310) — the colony's only route to its first tech, since both buildings
  that output `research` are themselves tech-gated.

  colony_hq's four recipes (hq_generate_power, hq_pump_water,
  hq_scrub_oxygen, hq_conduct_research) are all `concurrent: true` — the real
  engine (outpost_core::colony::production) runs them simultaneously against
  ONE building instance sharing a single scale factor. Since issue #272 the
  harness represents that faithfully: colony.yaml lists a single colony_hq
  entry and `BuildingInstance.concurrent_recipes` is populated from the pack.

  This bundle previously approximated it as four separate BuildingInstance
  entries all naming `colony_hq`. That gave the *correct numbers* — the
  calculator reads nothing but recipe flows, so the per-building fields
  (power_delta, worker_slots, slot_cost, maintenance) were never
  double-counted — but it described a colony that doesn't exist, and would
  have misled anyone reading the bundle as documentation.

  What the calculator still cannot express, by construction, is shared-scale
  throttling: it is a steady-state net-rate accumulator with no scale factor
  for *any* building, concurrent or not. A shortfall throttling every output
  together is proven instead by
  outpost_web::ws::tests::colony_hq_runs_all_concurrent_recipes_from_real_pack,
  which exercises the actual production.rs code path.
