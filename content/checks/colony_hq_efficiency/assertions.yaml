# Assertions for the colony_hq efficiency balance check.
#
# Expected net rates at population=100 with one colony_hq instance:
#   water:  24 produced − 15 colonists = +9/sol
#   oxygen:  7 produced −  5 colonists = +2/sol
#   power:  24 produced − 20 colonists = +4/sol
#   research: 1 produced − 0 consumed = +1/sol (issue #310)
#   networking_compute: 5 produced − 0 consumed = +5/sol (baseline comms
#     trickle, morale-crashes-pre-automation fix)
#
# Matches content/checks/bootstrap_colony/'s water/oxygen/power margins
# exactly (colony_hq's recipes are identical rates to the 3 standalone
# buildings it consolidates) while using 1 build slot instead of 3.

- commodity: water
  expect: closed
  min_net: 5.0
  label: water-surplus-at-least-5-per-sol

- commodity: oxygen
  expect: closed
  min_net: 1.0
  label: oxygen-surplus-at-least-1-per-sol

- commodity: power
  expect: closed
  min_net: 2.0
  label: power-surplus-at-least-2-per-sol

# Research trickle (issue #310). Nothing in this bundle consumes research, so
# the chain is trivially `closed` at +1/sol; the real engine drains that surplus
# into the system-wide pool each turn. The point of the assertion is `min_net` —
# it stops a future edit from silently zeroing the only pre-lab research source.
- commodity: research
  expect: closed
  min_net: 1.0
  label: research-trickle-at-least-1-per-sol

# Baseline networking_compute (colony_hq's hq_operate_baseline_comms,
# added so morale doesn't guarantee-crash to zero before the automation
# tech and comms_hub exist — see outpost_core/src/morale.rs). Same
# trivially-closed shape as research above: nothing here consumes it.
- commodity: networking_compute
  expect: closed
  min_net: 3.0
  label: networking-compute-trickle-at-least-3-per-sol
