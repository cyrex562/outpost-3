# Colony configuration for the component-tier balance check.
#
# Three fabricator instances, one per new recipe (issue #166's
# recipe-selection mechanic lets a single building type run different
# recipes on different building instances). Processed metals are supplied
# via generous imports rather than mined on-site — see pack.yaml.
buildings:
  - building_id: fabricator
    recipe_id: fabricate_mechanical_components
  - building_id: fabricator
    recipe_id: fabricate_electronic_components
  - building_id: fabricator
    recipe_id: fabricate_alloys

imports:
  - commodity_id: structural_metal
    rate: 6.0
  - commodity_id: conductive_metal
    rate: 4.0
  - commodity_id: precious_metal
    rate: 1.0
  - commodity_id: refractory_metal
    rate: 1.5
