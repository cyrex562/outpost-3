# Recipes used in the component-tier balance check — rates mirror
# content/base/recipes.yaml exactly.
- id: fabricate_mechanical_components
  name: Fabricate Mechanical Components
  building: fabricator
  cycle_sols: 1
  inputs:
    - id: structural_metal
      quantity: 3.0
    - id: conductive_metal
      quantity: 2.0
  outputs:
    - id: mechanical_components
      quantity: 2.0

- id: fabricate_electronic_components
  name: Fabricate Electronic Components
  building: fabricator
  cycle_sols: 2
  inputs:
    - id: conductive_metal
      quantity: 2.0
    - id: precious_metal
      quantity: 1.0
    - id: plastics
      quantity: 2.0
    - id: semiconductors
      quantity: 1.0
  outputs:
    - id: electronic_components
      quantity: 1.0

- id: fabricate_alloys
  name: Fabricate Alloys
  building: fabricator
  cycle_sols: 2
  inputs:
    - id: structural_metal
      quantity: 3.0
    - id: refractory_metal
      quantity: 2.0
  outputs:
    - id: alloys
      quantity: 2.0
