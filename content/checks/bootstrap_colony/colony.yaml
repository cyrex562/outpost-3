# Colony configuration for the bootstrap-colony balance check.
#
# colony_hq (3 BuildingInstance entries — one per concurrent recipe, see
# pack.yaml's approximation note) + greenhouse_dome, using just 2 of the 8
# available starter buildings, plus the synthetic 100-colonist consumption
# sink. No imports — everything must be produced on-site.
buildings:
  - building_id: colony_hq
    recipe_id: hq_generate_power
  - building_id: colony_hq
    recipe_id: hq_pump_water
  - building_id: colony_hq
    recipe_id: hq_scrub_oxygen
  - building_id: greenhouse_dome
    recipe_id: grow_rations_dome
  - building_id: colonist_life_support
    recipe_id: colonist_consumption

imports: []
