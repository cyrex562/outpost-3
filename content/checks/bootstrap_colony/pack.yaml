id: bootstrap-colony-check
name: Bootstrap Colony Sustainability Check
version: '0.1.0'
description: >
  Proves the base pack's starter (no-tech-prerequisite) building set closes
  food/water/oxygen/power for a 100-colonist population (the founding
  wizard's default) using exactly the 5 default build slots — one each of
  water_well, hydroponic_bay, life_support_module, solar_array_mk1, and
  basic_habitat (issue #166). Population per-capita consumption is modeled
  as a synthetic sink building (`colonist_life_support`) with no output,
  matching outpost_core::needs::NeedsConfig::default_survival()'s rates at
  population=100. Housing is a capacity check, not a flow rate, so it isn't
  representable here — see outpost_web::ws::tests::
  bootstrap_starter_buildings_sustain_default_starting_population for the
  real-engine proof that covers housing (and stability/growth) too.
