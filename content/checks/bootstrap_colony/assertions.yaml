# Assertions for the bootstrap-colony balance check.
#
# Expected net rates at population=100 with colony_hq + greenhouse_dome:
#   water:      24 produced − (2 greenhouse + 15 colonists) = +7/sol
#   food_ration: 12 produced − 10 colonists                 = +2/sol
#   biomass:     3 produced (grow_rations_dome byproduct), no
#                starter-set consumer                        = +3/sol
#   oxygen:      7 produced − 5 colonists                   = +2/sol
#   power:      24 produced − 20 colonists                  = +4/sol
#
# No overall-verdict assertion: every net is comfortably positive by design
# (a healthy starter margin, not a tight bottleneck), so the calculator
# classifies this as BalanceVerdict::Trivial rather than Closed — Trivial
# isn't a bug here, it's the point. The per-commodity assertions below are
# what actually matters.

- commodity: water
  expect: closed
  min_net: 5.0
  label: water-surplus-at-least-5-per-sol

- commodity: food_ration
  expect: closed
  min_net: 1.0
  label: food-ration-surplus-at-least-1-per-sol

- commodity: biomass
  expect: closed
  min_net: 1.0
  label: biomass-byproduct-surplus

- commodity: oxygen
  expect: closed
  min_net: 1.0
  label: oxygen-surplus-at-least-1-per-sol

- commodity: power
  expect: closed
  min_net: 2.0
  label: power-surplus-at-least-2-per-sol
