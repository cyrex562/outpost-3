# Assertions for the bootstrap-colony balance check.
#
# Expected net rates at population=100 with colony_hq + greenhouse_dome:
#   water:      24 produced − (2 greenhouse + 15 colonists) = +7/sol
#   food_ration: 12 produced − 10 colonists                 = +2/sol
#   biomass:     3 produced (grow_rations_dome byproduct), no
#                starter-set consumer                        = +3/sol
#   oxygen:      7 produced − 5 colonists                   = +2/sol
#   power:      24 produced − 20 colonists                  = +4/sol
#   research:    1 produced (colony_hq admin trickle), no
#                consumer in this bundle                     = +1/sol
#   networking_compute: 20 produced (colony_hq baseline comms trickle,
#                issue: morale-crashes-pre-automation fix — 4x colony_hq
#                instances each running the recipe, same pattern as
#                water/oxygen/power/research above), no consumer in this
#                bundle                                      = +20/sol
#
# No overall-verdict assertion: every net is comfortably positive by design
# (a healthy starter margin, not a tight bottleneck), so the calculator
# classifies this as BalanceVerdict::Trivial rather than Closed — Trivial
# isn't a bug here, it's the point. The per-commodity assertions below are
# what actually matters.

- commodity: water
  expect: closed
  min_net: 5.0
  label: water-surplus-at-least-5-per-sol

- commodity: food_ration
  expect: closed
  min_net: 1.0
  label: food-ration-surplus-at-least-1-per-sol

- commodity: biomass
  expect: closed
  min_net: 1.0
  label: biomass-byproduct-surplus

- commodity: oxygen
  expect: closed
  min_net: 1.0
  label: oxygen-surplus-at-least-1-per-sol

- commodity: power
  expect: closed
  min_net: 2.0
  label: power-surplus-at-least-2-per-sol

# The starter colony makes real tech progress on day one (issue #310): before
# this, no starter building produced `research` at all and both buildings that
# do are tech-gated, so a fresh colony could never reach its first tech except
# by a lucky survey-expedition anomaly. `min_net` is the assertion that matters
# — the chain is trivially closed since nothing here consumes research.
- commodity: research
  expect: closed
  min_net: 1.0
  label: research-trickle-at-least-1-per-sol

# Baseline networking_compute (colony_hq's hq_operate_baseline_comms,
# added so morale doesn't guarantee-crash to zero before the automation
# tech and comms_hub exist — see outpost_core/src/morale.rs). Same
# trivially-closed shape as research above: nothing here consumes it.
- commodity: networking_compute
  expect: closed
  min_net: 3.0
  label: networking-compute-trickle-at-least-3-per-sol
