# Recipes used in the bootstrap-colony balance check — rates mirror
# content/base/recipes.yaml exactly.
- id: hq_generate_power
  name: Generate Power (Colony HQ)
  building: colony_hq
  cycle_sols: 1
  inputs: []
  outputs:
    - id: power
      quantity: 24.0
  concurrent: true

- id: hq_pump_water
  name: Pump Water (Colony HQ)
  building: colony_hq
  cycle_sols: 1
  inputs: []
  outputs:
    - id: water
      quantity: 24.0
  concurrent: true

- id: hq_scrub_oxygen
  name: Scrub Oxygen (Colony HQ)
  building: colony_hq
  cycle_sols: 1
  inputs: []
  outputs:
    - id: oxygen
      quantity: 7.0
  concurrent: true

- id: grow_rations_dome
  name: Grow Rations (Greenhouse Dome)
  building: greenhouse_dome
  cycle_sols: 1
  inputs:
    - id: water
      quantity: 2.0
  outputs:
    - id: food_ration
      quantity: 12.0
    - id: biomass
      quantity: 3.0

# Synthetic sink: models a 100-colonist population's per-capita draw from
# outpost_core::needs::NeedsConfig::default_survival() (food_ration 0.1,
# water 0.15, oxygen 0.05, power 0.2 per colonist per sol). No output — a
# pure consumer, same trick used to represent fixed demand in this static
# flow-balance tool.
- id: colonist_consumption
  name: Colonist Consumption (100 colonists)
  building: colonist_life_support
  cycle_sols: 1
  inputs:
    - id: food_ration
      quantity: 10.0
    - id: water
      quantity: 15.0
    - id: oxygen
      quantity: 5.0
    - id: power
      quantity: 20.0
  outputs: []
