# Buildings used in the bootstrap-colony balance check — colony_hq (listed
# 3 times, once per concurrent recipe, since BalanceCalculator::compute has
# no concept of `concurrent` — see content/checks/colony_hq_efficiency/ for
# the same approximation) plus greenhouse_dome, mirroring content/base/
# exactly, plus a synthetic population sink (see pack.yaml).
- id: colony_hq
  name: Colony HQ
  category: services

- id: greenhouse_dome
  name: Greenhouse Dome
  category: extraction

- id: colonist_life_support
  name: Colonist Life Support (population sink)
  category: other
