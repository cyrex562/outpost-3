# Resource definitions for Outpost 3 MVP
# These are loaded at runtime and can be modded
# 
# Structure:
# - Tier 0: Raw Materials (extracted from deposits)
# - Tier 1: Refined Materials (processed from raw)
# - Tier 2: Manufactured Components (crafted from refined)
# - Tier 3: Consumables (used by population)
# - Special: Virtual resources (currency, data)

# ==============================================================================
# TIER 0: RAW MATERIALS
# ==============================================================================

