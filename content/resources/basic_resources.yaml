# Example resource definitions for Outpost 3
# These are loaded at runtime and can be modded

# Tier 0: Raw Materials

- id: iron_ore
  name: Iron Ore
  description: Raw iron ore extracted from deposits. Contains iron oxide that must be smelted.
  category: metallic_ore
  storage:
    phase: solid
    hazardous: false
  density_kg_per_m3: 5000.0
  base_value: 10.0
  tradeable: true
  extractable: true
  consumable: false
  stack_size: 0

- id: water
  name: Water
  description: H2O - essential for life support, agriculture, and industrial processes.
  category: hydrospheric
  storage:
    phase: liquid
    min_temperature_k: 273.0
    max_temperature_k: 373.0
    hazardous: false
  density_kg_per_m3: 1000.0
  base_value: 1.0
  tradeable: true
  extractable: true
  consumable: true
  stack_size: 0

