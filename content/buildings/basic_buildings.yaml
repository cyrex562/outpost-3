# Example building definitions for Outpost 3
# These are loaded at runtime and can be modded

# Solar Array - Basic power generation
- id: solar_array_mk1
  name: Solar Array Mk1
  description: Converts sunlight into electrical energy. Reliable but dependent on star proximity and atmospheric conditions.
  category: power_generation
  construction_costs:
    - resource_id: steel
      amount: 50
    - resource_id: electronics
      amount: 20
  construction_time_ticks: 120
  power_output_mw: 10.0
  worker_capacity: 2
  recipes: []
  maintenance_cost:
    electronics: 0.1
  upgradeable: true
  upgrade_to: solar_array_mk2
  morale_bonus: 0.0

# Mine - Extracts raw ore from deposits
- id: iron_mine
  name: Iron Mine
  description: Extracts iron ore from surface or underground deposits.
  category: mining
  construction_costs:
    - resource_id: steel
      amount: 100
    - resource_id: electronics
      amount: 10
  construction_time_ticks: 200
  power:
    base_mw: 5.0
    per_level_mw: 2.0
  worker_capacity: 10
  recipes:
    - id: extract_iron_ore
      name: Extract Iron Ore
      description: Mine iron ore from the deposit
      inputs: []
      outputs:
        - resource_id: iron_ore
          amount_per_tick: 10.0
      duration_ticks: 10
  maintenance_cost:
    steel: 0.5
  upgradeable: true
  upgrade_to: iron_mine_mk2
  morale_bonus: 0.0

# Smelter - Processes ore into metal
- id: smelter
  name: Smelter
  description: Refines raw ore into usable metal ingots.
  category: refining
  construction_costs:
    - resource_id: steel
      amount: 150
    - resource_id: electronics
      amount: 30
  construction_time_ticks: 250
  power:
    base_mw: 12.0
    per_level_mw: 3.0
  worker_capacity: 8
  recipes:
    - id: smelt_iron
      name: Smelt Iron
      description: Convert iron ore into steel
      inputs:
        - resource_id: iron_ore
          amount_per_tick: 10.0
      outputs:
        - resource_id: steel
          amount_per_tick: 5.0
      duration_ticks: 5
  maintenance_cost:
    steel: 1.0
  upgradeable: true
  upgrade_to: advanced_smelter
  morale_bonus: 0.0

# Habitat - Houses colonists
- id: basic_habitat
  name: Basic Habitat
  description: Standard living quarters for colonists. Provides basic shelter and life support.
  category: housing
  construction_costs:
    - resource_id: steel
      amount: 200
    - resource_id: electronics
      amount: 50
  construction_time_ticks: 300
  power:
    base_mw: 3.0
    per_level_mw: 1.0
  worker_capacity: 0
  housing_capacity: 20
  recipes: []
  maintenance_cost:
    steel: 0.5
    electronics: 0.2
  upgradeable: true
  upgrade_to: improved_habitat
  morale_bonus: 5.0

# Warehouse - Stores resources
- id: warehouse
  name: Warehouse
  description: Bulk storage facility for solid resources and manufactured goods.
  category: storage
  construction_costs:
    - resource_id: steel
      amount: 100
  construction_time_ticks: 150
  power:
    base_mw: 1.0
    per_level_mw: 0.5
  worker_capacity: 3
  storage_capacity: 10000.0
  recipes: []
  maintenance_cost:
    steel: 0.2
  upgradeable: true
  upgrade_to: large_warehouse
  morale_bonus: 0.0

# Farm - Produces food
- id: hydroponics_bay
  name: Hydroponics Bay
  description: Indoor farming facility using nutrient solutions. Produces food independent of soil quality.
  category: farming
  construction_costs:
    - resource_id: steel
      amount: 80
    - resource_id: electronics
      amount: 40
  construction_time_ticks: 180
  power:
    base_mw: 4.0
    per_level_mw: 1.5
  worker_capacity: 6
  recipes:
    - id: grow_vegetables
      name: Grow Vegetables
      description: Cultivate fresh vegetables
      inputs:
        - resource_id: water
          amount_per_tick: 5.0
        - resource_id: nutrients
          amount_per_tick: 1.0
      outputs:
        - resource_id: food
          amount_per_tick: 8.0
      duration_ticks: 100
  maintenance_cost:
    electronics: 0.3
  upgradeable: true
  upgrade_to: advanced_hydroponics
  morale_bonus: 2.0

# Fabricator - Manufactures components
- id: fabricator
  name: Fabricator
  description: Advanced manufacturing facility that produces machine parts and electronics from refined metals.
  category: manufacturing
  construction_costs:
    - resource_id: steel
      amount: 180
    - resource_id: electronics
      amount: 60
  construction_time_ticks: 280
  power:
    base_mw: 8.0
    per_level_mw: 2.5
  worker_capacity: 12
  recipes:
    - id: craft_components
      name: Craft Components
      description: Manufacture structural components
      inputs:
        - resource_id: steel
          amount_per_tick: 5.0
      outputs:
        - resource_id: components
          amount_per_tick: 3.0
      duration_ticks: 8
    - id: craft_electronics
      name: Craft Electronics
      description: Assemble electronic components
      inputs:
        - resource_id: copper
          amount_per_tick: 2.0
        - resource_id: silicon
          amount_per_tick: 1.0
      outputs:
        - resource_id: electronics
          amount_per_tick: 1.0
      duration_ticks: 12
  maintenance_cost:
    steel: 0.8
    electronics: 0.5
  upgradeable: true
  upgrade_to: advanced_fabricator
  morale_bonus: 0.0

# Nuclear Reactor - High-power generation with fuel
- id: nuclear_reactor
  name: Nuclear Reactor
  description: High-output fission reactor. Requires uranium fuel but provides reliable power independent of stellar proximity.
  category: power_generation
  construction_costs:
    - resource_id: steel
      amount: 300
    - resource_id: electronics
      amount: 100
    - resource_id: components
      amount: 50
  construction_time_ticks: 500
  power_output_mw: 50.0
  worker_capacity: 8
  recipes:
    - id: generate_power
      name: Generate Power
      description: Consume fuel to generate electricity
      inputs:
        - resource_id: uranium_fuel
          amount_per_tick: 0.1
      outputs: []
      duration_ticks: 1
  maintenance_cost:
    steel: 2.0
    electronics: 1.0
  upgradeable: true
  upgrade_to: fusion_reactor
  morale_bonus: -2.0

# Water Purifier - Produces clean water
- id: water_purifier
  name: Water Purifier
  description: Processes ice or contaminated water into clean, potable water for consumption and industrial use.
  category: infrastructure
  construction_costs:
    - resource_id: steel
      amount: 120
    - resource_id: electronics
      amount: 40
  construction_time_ticks: 200
  power:
    base_mw: 6.0
    per_level_mw: 2.0
  worker_capacity: 4
  recipes:
    - id: purify_water
      name: Purify Water
      description: Convert ice into clean water
      inputs:
        - resource_id: ice
          amount_per_tick: 10.0
      outputs:
        - resource_id: water
          amount_per_tick: 8.0
      duration_ticks: 5
  maintenance_cost:
    steel: 0.4
    electronics: 0.3
  upgradeable: true
  upgrade_to: advanced_purifier
  morale_bonus: 1.0

# Life Support System - Air production and climate control
- id: life_support_system
  name: Life Support System
  description: Critical infrastructure that generates breathable atmosphere and maintains temperature control.
  category: infrastructure
  construction_costs:
    - resource_id: steel
      amount: 250
    - resource_id: electronics
      amount: 80
    - resource_id: components
      amount: 40
  construction_time_ticks: 350
  power:
    base_mw: 10.0
    per_level_mw: 3.0
  worker_capacity: 6
  recipes:
    - id: produce_oxygen
      name: Produce Oxygen
      description: Electrolyze water to generate breathable oxygen
      inputs:
        - resource_id: water
          amount_per_tick: 5.0
      outputs:
        - resource_id: oxygen
          amount_per_tick: 10.0
      duration_ticks: 10
  maintenance_cost:
    steel: 1.0
    electronics: 0.8
  upgradeable: true
  upgrade_to: advanced_life_support
  morale_bonus: 3.0

# Large Warehouse - Tier-2 bulk storage
- id: large_warehouse
  name: Large Warehouse
  description: High-capacity storage complex for bulk solid resources and manufactured goods. Multi-wing structure with automated handling systems.
  category: storage
  construction_costs:
    - resource_id: steel
      amount: 300
    - resource_id: components
      amount: 50
  construction_time_ticks: 300
  power:
    base_mw: 2.0
    per_level_mw: 1.0
  worker_capacity: 6
  storage_capacity: 25000.0
  recipes: []
  maintenance_cost:
    steel: 0.5
    electronics: 0.1
  upgradeable: false
  upgrade_to: null
  morale_bonus: 0.0
