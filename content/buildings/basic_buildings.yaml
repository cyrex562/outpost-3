# Example building definitions for Outpost 3
# These are loaded at runtime and can be modded

# Solar Array - Basic power generation
- id: solar_array_mk1
  name: Solar Array Mk1
  description: Converts sunlight into electrical energy. Reliable but dependent on star proximity and atmospheric conditions.
  category: power_generation
  construction_costs:
    - resource_id: steel
      amount: 50
    - resource_id: electronics
      amount: 20
  construction_time_ticks: 120
  power_output_mw: 10.0
  worker_capacity: 2
  recipes: []
  maintenance_cost:
    electronics: 0.1
  upgradeable: true
  upgrade_to: solar_array_mk2
  morale_bonus: 0.0

# Mine - Extracts raw ore from deposits
- id: iron_mine
  name: Iron Mine
  description: Extracts iron ore from surface or underground deposits.
  category: mining
  construction_costs:
    - resource_id: steel
      amount: 100
    - resource_id: electronics
      amount: 10
  construction_time_ticks: 200
  power:
    base_mw: 5.0
    per_level_mw: 2.0
  worker_capacity: 10
  recipes:
    - id: extract_iron_ore
      name: Extract Iron Ore
      description: Mine iron ore from the deposit
      inputs: []
      outputs:
        - resource_id: iron_ore
          amount_per_tick: 10.0
      duration_ticks: 10
  maintenance_cost:
    steel: 0.5
  upgradeable: true
  upgrade_to: iron_mine_mk2
  morale_bonus: 0.0

# Smelter - Processes ore into metal
- id: smelter
  name: Smelter
  description: Refines raw ore into usable metal ingots.
  category: refining
  construction_costs:
    - resource_id: steel
      amount: 150
    - resource_id: electronics
      amount: 30
  construction_time_ticks: 250
  power:
    base_mw: 12.0
    per_level_mw: 3.0
  worker_capacity: 8
  recipes:
    - id: smelt_iron
      name: Smelt Iron
      description: Convert iron ore into steel
      inputs:
        - resource_id: iron_ore
          amount_per_tick: 10.0
      outputs:
        - resource_id: steel
          amount_per_tick: 5.0
      duration_ticks: 5
  maintenance_cost:
    steel: 1.0
  upgradeable: true
  upgrade_to: advanced_smelter
  morale_bonus: 0.0

# Habitat - Houses colonists
- id: basic_habitat
  name: Basic Habitat
  description: Standard living quarters for colonists. Provides basic shelter and life support.
  category: housing
  construction_costs:
    - resource_id: steel
      amount: 200
    - resource_id: electronics
      amount: 50
  construction_time_ticks: 300
  power:
    base_mw: 3.0
    per_level_mw: 1.0
  worker_capacity: 0
  housing_capacity: 20
  recipes: []
  maintenance_cost:
    steel: 0.5
    electronics: 0.2
  upgradeable: true
  upgrade_to: improved_habitat
  morale_bonus: 5.0

# Warehouse - Stores resources
- id: warehouse
  name: Warehouse
  description: Bulk storage facility for solid resources and manufactured goods.
  category: storage
  construction_costs:
    - resource_id: steel
      amount: 100
  construction_time_ticks: 150
  power:
    base_mw: 1.0
    per_level_mw: 0.5
  worker_capacity: 3
  storage_capacity: 10000.0
  recipes: []
  maintenance_cost:
    steel: 0.2
  upgradeable: true
  upgrade_to: large_warehouse
  morale_bonus: 0.0

# Farm - Produces food
- id: hydroponics_bay
  name: Hydroponics Bay
  description: Indoor farming facility using nutrient solutions. Produces food independent of soil quality.
  category: farming
  construction_costs:
    - resource_id: steel
      amount: 80
    - resource_id: electronics
      amount: 40
  construction_time_ticks: 180
  power:
    base_mw: 4.0
    per_level_mw: 1.5
  worker_capacity: 6
  recipes:
    - id: grow_vegetables
      name: Grow Vegetables
      description: Cultivate fresh vegetables
      inputs:
        - resource_id: water
          amount_per_tick: 5.0
        - resource_id: nutrients
          amount_per_tick: 1.0
      outputs:
        - resource_id: food
          amount_per_tick: 8.0
      duration_ticks: 100
  maintenance_cost:
    electronics: 0.3
  upgradeable: true
  upgrade_to: advanced_hydroponics
  morale_bonus: 2.0
