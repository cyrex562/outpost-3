[package]
name = "outpost-client"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# Desktop is the default platform flavor for this crate. Enable "wasm" for the web build.
default = ["desktop"]
desktop = []
wasm = []

[dependencies]
bevy = { version = "0.13", default-features = true }
bevy_egui = "0.27"
egui = "0.27"
egui_plot = "0.27"
outpost-core = { path = "../outpost-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
thiserror = "1"

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbOpenDbRequest",
    "IdbRequest",
    "DomException",
] }
indexed_db_futures = "0.4"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
proptest = "1"
tempfile = "3"
