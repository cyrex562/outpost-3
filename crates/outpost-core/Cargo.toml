[package]
name = "outpost-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure domain logic for Outpost 3 colony simulation (zero I/O)"

[lib]

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Date and time (for domain types only, no Utc::now() allowed)
chrono = { workspace = true }

# Error handling (thiserror for domain errors)
thiserror = { workspace = true }

# UUID generation
uuid = { workspace = true }

# Random number generation (for procedural generation)
rand = { workspace = true }

[dev-dependencies]
proptest = "1"
