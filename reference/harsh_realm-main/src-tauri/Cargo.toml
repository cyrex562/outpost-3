[package]
name = "harsh-realm-desktop"
version = "0.50.0"
edition = "2021"
description = "Tauri desktop shell for Harsh Realm"
license = "MIT"
default-run = "harsh-realm-desktop"

[lib]
name = "harsh_realm_desktop_lib"
# The cdylib target is required for the mobile/library build; the bin below is
# the desktop entry point.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "harsh-realm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rand = "0.8"
# Context-carrying error type for the in-process backend launcher, replacing
# bare `std::io::Result`.
anyhow = "1"
# Core game logic ported to Rust. Add modules here as they migrate from Python.
harsh-core = { path = "../crates/harsh-core" }
# The Axum web host (B9) — run in-process to serve the frontend + REST/WS API,
# replacing the former Python (uvicorn) sidecar.
harsh-web = { path = "../crates/harsh-web" }

[features]
# Default to the Tauri custom-protocol used in production bundles.
custom-protocol = ["tauri/custom-protocol"]
