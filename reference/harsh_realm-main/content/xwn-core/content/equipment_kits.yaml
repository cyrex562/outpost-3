# Starting equipment kits.
# enc = encumbrance slots (WWN rules: most items 1, heavy armor 2, worn/trivial 0)
kits:
  # Warrior kits (3)
  - id: heavy_fighter
    name: "Heavy Fighter"
    class: warrior
    description: "Well-armored melee combatant who wins by outlasting the enemy."
    items:
      - id: chain_mail
        name: "Chain Mail"
        type: armor
        ac: 14
        enc: 2
      - id: longsword
        name: "Longsword"
        type: melee_weapon
        damage: "1d8"
        enc: 1
      - id: shield
        name: "Shield"
        type: shield
        ac_bonus: 1
        enc: 1
      - id: backpack
        name: "Backpack"
        type: gear
        enc: 0
      - id: rations_3
        name: "Rations (3 days)"
        type: consumable
        enc: 1

