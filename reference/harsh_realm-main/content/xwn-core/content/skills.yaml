# XWN skill definitions.
# available_milestone: the milestone at which this skill becomes mechanically active.
# 99 = not yet active (future milestones).
# category / subcategory: grouping for the skill-tree picker.
# requirements: declarative constraints that must hold for the skill to be takeable
#   (see SkillRequirement). Types: class, attribute, trait — extensible per pack.
skills:
  - id: administer
    name: Administer
    description: "Manage organizations, bureaucracy, logistics."
    default_attribute: int
    alternate_attributes: [cha]
    can_use_untrained: true
    combat_skill: false
    available_milestone: 4
    category: Knowledge

  - id: connect
