pattern: "items/armor"
label: "Armor"
widget: RegistryEditor
accessor: { kind: root }
entry_key: id
fields:
  - { key: id, type: text, label: ID, width: md }
  - { key: name, type: text, label: Name, width: md }
  - { key: ac, type: number, label: AC, width: sm }
  - { key: enc, type: number, label: Enc, width: sm }
  - { key: cost, type: number, label: Cost, width: sm }
  - { key: tags, type: tags, label: Tags, width: full }
allow_add: true
allow_delete: true
